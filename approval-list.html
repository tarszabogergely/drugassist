<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Jóváhagyásra vár</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #fff9f2; /* Halvány, meleg narancssárga háttér */
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 20px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-info {
    color: #475569;
    font-size: 14px;
    font-weight: 600;
}

.container {
    padding: 30px;
}

/* SZŰRŐ SÁV */
.filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.filter-bar input[type="date"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
    font-weight: 600;
    color: #334155;
}

.filter-btn-quick {
    background: #fff3e0;
    color: #e65100;
    border: 1px solid #ffe0b2;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.filter-btn-quick:hover {
    background: #ffe0b2;
}

.filter-btn-submit {
    background: #1976d2;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.filter-btn-submit:hover {
    background: #1565c0;
}

.section {
    margin-bottom: 40px;
}

.section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

th, td {
    padding: 14px;
    font-size: 14px;
}

th {
    background-color: #f0f2f5;
    text-align: left;
}

tr:not(:last-child) {
    border-bottom: 1px solid #eee;
}

tr:hover {
    background-color: #fafafa;
}

.action-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background-color: #1976d2;
    color: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.action-btn:hover {
    background-color: #1565c0;
}

.badge {
    background-color: #ff9800;
    color: white;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 12px;
}

.empty-msg {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    color: #666;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Jóváhagyásra vár</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-size:18px; font-weight:600;" title="Kezdőlap">🏠</a></div>
        <div class="user-info">
            <span id="userName">Betöltés...</span> | <span id="dateTime"></span>
        </div>
    </div>
</header>

<div class="container">

    <!-- DÁTUMSZŰRŐ SÁV -->
    <div class="filter-bar">
        <button class="filter-btn-quick" onclick="setQuickDateFilter(0)">Ma</button>
        <button class="filter-btn-quick" onclick="setQuickDateFilter(1)">Holnap</button>
        <button class="filter-btn-quick" onclick="setQuickDateFilter(2)">Holnapután</button>
        <input type="date" id="filterStartDate">
        <input type="date" id="filterEndDate">
        <button class="filter-btn-submit" onclick="loadApprovalList()">Szűrés</button>
    </div>

    <div id="contentContainer">
        <div class="empty-msg">Adatok betöltése...</div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // 1. AUTENTIKÁCIÓ ÉS FELHASZNÁLÓNÉV KIJELZÉSE
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name || user.email;

        try {
            const { data: profile } = await window.supabaseClient
                .from('profiles')
                .select('full_name')
                .or(`id.eq.${user.id},user_id.eq.${user.id}`)
                .maybeSingle();

            if (profile && profile.full_name) {
                document.getElementById("userName").innerText = profile.full_name;
            }
        } catch (e) {
            console.error("Profil név betöltési hiba:", e);
        }
    }

    loadApprovalList();
});

// GYORS DÁTUMBEÁLLÍTÁS (0: Ma, 1: Holnap, 2: Holnapután)
function setQuickDateFilter(offsetDays) {
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + offsetDays);
    const dateStr = targetDate.toISOString().split('T')[0];

    document.getElementById("filterStartDate").value = dateStr;
    document.getElementById("filterEndDate").value = dateStr;
    loadApprovalList();
}

async function loadApprovalList() {
    const container = document.getElementById("contentContainer");
    const startDateVal = document.getElementById("filterStartDate").value;
    const endDateVal = document.getElementById("filterEndDate").value;

    try {
        // 1. Submitted státuszú igénylések alap lekérdezése
        let query = window.supabaseClient
            .from('prescriptions')
            .select('id, created_at, patient_id, patients(name, room_bed, department), prescription_items(id)')
            .eq('status', 'submitted');

        // Dátumszűrés alkalmazása, ha meg van adva
        if (startDateVal) {
            query = query.gte('created_at', `${startDateVal}T00:00:00Z`);
        }
        if (endDateVal) {
            query = query.lte('created_at', `${endDateVal}T23:59:59Z`);
        }

        const { data: prescriptions, error } = await query.order('created_at', { ascending: true });

        if (error) throw error;

        if (!prescriptions || prescriptions.length === 0) {
            container.innerHTML = '<div class="empty-msg">Jelenleg nincs jóváhagyásra váró gyógyszerigénylés a kiválasztott időszakban.</div>';
            return;
        }

        // 2. Csoportosítás osztályok szerint
        const groupedByDept = {};
        prescriptions.forEach(p => {
            const dept = p.patients ? p.patients.department : 'Ismeretlen';
            if (!groupedByDept[dept]) {
                groupedByDept[dept] = [];
            }
            groupedByDept[dept].push(p);
        });

        // 3. HTML generálása osztályonként
        let html = '';
        for (const [dept, list] of Object.entries(groupedByDept)) {
            html += `
                <div class="section">
                    <div class="section-title">
                        ${dept} <span class="badge">${list.length} beteg</span>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Beteg neve</th>
                                <th>Ágy</th>
                                <th>Dátum</th>
                                <th>Utolsó módosítás</th>
                                <th>Gyógyszersorok</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            list.forEach(p => {
                const createdDate = new Date(p.created_at);
                const dateStr = createdDate.toLocaleDateString('hu-HU');
                const timeStr = createdDate.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
                const itemCount = p.prescription_items ? p.prescription_items.length : 0;
                const patientName = p.patients ? p.patients.name : 'Ismeretlen';
                const bed = p.patients ? p.patients.room_bed : '-';

                html += `
                    <tr>
                        <td><strong>${patientName}</strong></td>
                        <td>${bed}</td>
                        <td><strong>${dateStr}</strong></td>
                        <td>${timeStr}</td>
                        <td>${itemCount} tétel</td>
                        <td style="text-align: right;">
                            <button class="action-btn" onclick="location.href='approval.html?patientId=${p.patient_id}&prescriptionId=${p.id}'">Jóváhagyás</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
        }

        container.innerHTML = html;

    } catch (err) {
        console.error("Hiba a lista betöltésekor:", err);
        container.innerHTML = '<div class="empty-msg">Hiba történt az adatok betöltése során.</div>';
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
