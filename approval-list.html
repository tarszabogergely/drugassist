<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Jóváhagyásra vár</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 20px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.container {
    padding: 30px;
}

.section {
    margin-bottom: 40px;
}

.section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

th, td {
    padding: 14px;
    font-size: 14px;
}

th {
    background-color: #f0f2f5;
    text-align: left;
}

tr:not(:last-child) {
    border-bottom: 1px solid #eee;
}

tr:hover {
    background-color: #fafafa;
}

.action-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background-color: #1976d2;
    color: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.action-btn:hover {
    background-color: #1565c0;
}

.badge {
    background-color: #ff9800;
    color: white;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 12px;
}

.empty-msg {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    color: #666;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Jóváhagyásra vár</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-weight:600;">← Vissza a kezdőlapra</a></div>
        <div id="dateTime"></div>
    </div>
</header>

<div id="contentContainer" class="container">
    <div class="empty-msg">Adatok betöltése...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    Auth.requireAuth();
    loadApprovalList();
});

async function loadApprovalList() {
    const container = document.getElementById("contentContainer");

    try {
        // 1. Submitted státuszú igénylések lekérése beteg- és tételtadattal
        const { data: prescriptions, error } = await window.supabaseClient
            .from('prescriptions')
            .select('id, created_at, patient_id, patients(name, room_bed, department), prescription_items(id)')
            .eq('status', 'submitted')
            .order('created_at', { ascending: true });

        if (error) throw error;

        if (!prescriptions || prescriptions.length === 0) {
            container.innerHTML = '<div class="empty-msg">Jelenleg nincs jóváhagyásra váró gyógyszerigénylés.</div>';
            return;
        }

        // 2. Csoportosítás osztályok szerint
        const groupedByDept = {};
        prescriptions.forEach(p => {
            const dept = p.patients ? p.patients.department : 'Ismeretlen';
            if (!groupedByDept[dept]) {
                groupedByDept[dept] = [];
            }
            groupedByDept[dept].push(p);
        });

        // 3. HTML generálása osztályonként
        let html = '';
        for (const [dept, list] of Object.entries(groupedByDept)) {
            html += `
                <div class="section">
                    <div class="section-title">
                        ${dept} <span class="badge">${list.length} beteg</span>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Beteg neve</th>
                                <th>Ágy</th>
                                <th>Utolsó módosítás</th>
                                <th>Gyógyszersorok</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            list.forEach(p => {
                const timeStr = new Date(p.created_at).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
                const itemCount = p.prescription_items ? p.prescription_items.length : 0;
                const patientName = p.patients ? p.patients.name : 'Ismeretlen';
                const bed = p.patients ? p.patients.room_bed : '-';

                html += `
                    <tr>
                        <td><strong>${patientName}</strong></td>
                        <td>${bed}</td>
                        <td>${timeStr}</td>
                        <td>${itemCount} tétel</td>
                        <td style="text-align: right;">
                            <button class="action-btn" onclick="location.href='approval.html?patientId=${p.patient_id}&prescriptionId=${p.id}'">Jóváhagyás</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
        }

        container.innerHTML = html;

    } catch (err) {
        console.error("Hiba a lista betöltésekor:", err);
        container.innerHTML = '<div class="empty-msg">Hiba történt az adatok betöltése során.</div>';
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
