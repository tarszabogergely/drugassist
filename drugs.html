<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrugAssist – Gyógyszertörzsek Kezelése</title>

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 { margin: 0; font-size: 22px; color: #1565c0; }

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.container {
    padding: 32px;
    width: 100%;
    box-sizing: border-box;
}

/* FÜLEK (TABS) */
.tab-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 8px;
}

.tab-btn {
    background: white;
    color: #475569;
    border: 1px solid #cbd5e1;
    padding: 12px 24px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: 0.2s;
}

.tab-btn.active {
    background: #1976d2;
    color: white;
    border-color: #1976d2;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.2);
}

/* KERESŐ ÉS VEZÉRLÉS */
.search-bar-container {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

.search-input {
    flex: 1;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    outline: none;
}

.search-input:focus {
    border-color: #1976d2;
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
}

/* TÁBLÁZAT */
.table-card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td { padding: 14px 16px; text-align: left; font-size: 14px; }
th { background-color: #f8fafc; color: #475569; font-weight: 600; border-bottom: 2px solid #e2e8f0; }

tr:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
tr.drug-row { cursor: pointer; transition: 0.2s; }
tr.drug-row:hover { background-color: #f0f7ff; }

.status-active {
    color: #2e7d32;
    font-weight: 700;
    font-size: 12px;
    background: #e8f5e9;
    padding: 4px 10px;
    border-radius: 12px;
}

.status-inactive {
    color: #c62828;
    font-weight: 700;
    font-size: 12px;
    background: #ffebee;
    padding: 4px 10px;
    border-radius: 12px;
}

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-card {
    background: white;
    width: 600px;
    max-height: 90vh;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 6px;
}

.form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

button.btn-primary {
    background: #1976d2;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

button.btn-primary:hover { background: #1565c0; }

button.btn-secondary {
    background: #f1f5f9;
    color: #475569;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

.loading-msg {
    padding: 30px;
    text-align: center;
    color: #64748b;
}
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Gyógyszertörzsek Kezelése</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-weight:600;">← Vissza a kezdőlapra</a></div>
        <div id="dateTime"></div>
    </div>
</header>

<div class="container">

<!-- FÜLEK -->
<div class="tab-bar">
    <button id="tabLocal" class="tab-btn active" onclick="switchTab('local')">📦 Patikai / Helyi Törzs</button>
    <button id="tabPupha" class="tab-btn" onclick="switchTab('pupha')">🏛️ PuPha Törzs (5000+ Gyógyszer)</button>
</div>

<!-- KERESŐ -->
<div class="search-bar-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Gyógyszernév, hatóanyag, ATC kód vagy vonalkód keresése..." oninput="debounceSearch()">
</div>

<!-- TÁBLÁZAT -->
<div class="table-card">
    <table id="drugsTable">
        <thead id="tableHeader">
            <!-- JS Tölti fel -->
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6" class="loading-msg">Adatok betöltése...</td></tr>
        </tbody>
    </table>
</div>

</div>

<!-- SZERKESZTŐ MODAL -->
<div id="editModal" class="modal-overlay">
    <div class="modal-card">
        <h3 id="modalTitle" style="margin-top:0; color:#1e293b;">Gyógyszer Adatainak Szerkesztése</h3>
        
        <form id="editForm" onsubmit="event.preventDefault(); saveDrugChanges();">
            <input type="hidden" id="editDrugId">

            <div class="form-group">
                <label>Gyógyszer Neve (Készítmény megnevezése)</label>
                <input type="text" id="editBrandName" required>
            </div>

            <div class="form-group">
                <label>Hatóanyag</label>
                <input type="text" id="editIngredient">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                    <label>ATC Kód</label>
                    <input type="text" id="editAtcCode">
                </div>
                <div class="form-group">
                    <label>TTT Kód</label>
                    <input type="text" id="editTttCode">
                </div>
            </div>

            <div class="form-group">
                <label>Kiszerelés / Alaktag (Morphology)</label>
                <input type="text" id="editMorphology">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                    <label>Vonalkód (EAN / EKEIDR)</label>
                    <input type="text" id="editBarcode">
                </div>
                <div id="activeGroup" class="form-group">
                    <label>Státusz</label>
                    <select id="editIsActive">
                        <option value="true">✓ Aktív készleten</option>
                        <option value="false">✖ Inaktív / Hiánycikk</option>
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeEditModal()">Mégse</button>
                <button type="submit" class="btn-primary">✓ Módosítások Mentése</button>
            </div>
        </form>
    </div>
</div>

<script>
let currentTab = 'local'; // 'local' vagy 'pupha'
let drugItems = [];
let searchTimeout = null;

document.addEventListener("DOMContentLoaded", () => {
    Auth.requireAuth();
    loadDrugsData();
});

function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabLocal").className = tab === 'local' ? 'tab-btn active' : 'tab-btn';
    document.getElementById("tabPupha").className = tab === 'pupha' ? 'tab-btn active' : 'tab-btn';
    document.getElementById("searchInput").value = '';
    
    loadDrugsData();
}

function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        loadDrugsData();
    }, 300);
}

// Gyógyszer adatok betöltése Supabase-ből
async function loadDrugsData() {
    const tbody = document.getElementById("tableBody");
    const thead = document.getElementById("tableHeader");
    const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();

    tbody.innerHTML = '<tr><td colspan="6" class="loading-msg">Adatok betöltése...</td></tr>';

    try {
        if (currentTab === 'local') {
            thead.innerHTML = `
                <tr>
                    <th>Gyógyszernév</th>
                    <th>Hatóanyag</th>
                    <th>ATC Kód</th>
                    <th>Alaktag / Kiszerelés</th>
                    <th>Vonalkód</th>
                    <th style="text-align:center;">Státusz</th>
                </tr>
            `;

            let query = window.supabaseClient.from('local_inventory_master').select('*');

            if (searchTerm) {
                query = query.or(`brand_name.ilike.%${searchTerm}%,active_ingredient.ilike.%${searchTerm}%,atc_code.ilike.%${searchTerm}%,barcode.ilike.%${searchTerm}%`);
            }

            const { data, error } = await query.order('brand_name', { ascending: true }).limit(200);
            if (error) throw error;
            drugItems = data || [];

            renderLocalTable(drugItems);

        } else {
            thead.innerHTML = `
                <tr>
                    <th>Gyógyszernév</th>
                    <th>Hatóanyag</th>
                    <th>ATC Kód</th>
                    <th>TTT Kód</th>
                    <th>Kiszerelés</th>
                </tr>
            `;

            let query = window.supabaseClient.from('pupha_master').select('*');

            if (searchTerm) {
                query = query.or(`brand_name.ilike.%${searchTerm}%,active_ingredient.ilike.%${searchTerm}%,atc_code.ilike.%${searchTerm}%,ttt_code.ilike.%${searchTerm}%`);
            }

            const { data, error } = await query.order('brand_name', { ascending: true }).limit(200);
            if (error) throw error;
            drugItems = data || [];

            renderPuphaTable(drugItems);
        }
    } catch (err) {
        console.error("Hiba az adatok betöltésekor:", err);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c62828; padding:24px;">Hiba történt az adatok betöltése során.</td></tr>`;
    }
}

// Helyi törzs táblázat kirajzolása
function renderLocalTable(items) {
    const tbody = document.getElementById("tableBody");
    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b; padding:24px;">Nincs találat a helyi patikai törzsben.</td></tr>';
        return;
    }

    let html = '';
    items.forEach((item, idx) => {
        const isActive = item.is_active !== false;
        html += `
            <tr class="drug-row" onclick="openEditModal(${idx})">
                <td><strong style="color:#1e293b; font-size:15px;">${item.brand_name}</strong></td>
                <td style="color:#475569;">${item.active_ingredient || '-'}</td>
                <td style="color:#1565c0; font-weight:600;">${item.atc_code || '-'}</td>
                <td style="color:#64748b; font-size:13px;">${item.morphology || '-'}</td>
                <td style="font-family:monospace; color:#334155;">${item.barcode || '-'}</td>
                <td style="text-align:center;">
                    ${isActive ? '<span class="status-active">✓ Aktív</span>' : '<span class="status-inactive">✖ Inaktív</span>'}
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

// PuPha törzs táblázat kirajzolása
function renderPuphaTable(items) {
    const tbody = document.getElementById("tableBody");
    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b; padding:24px;">Nincs találat a PuPha törzsben.</td></tr>';
        return;
    }

    let html = '';
    items.forEach((item, idx) => {
        html += `
            <tr class="drug-row" onclick="openEditModal(${idx})">
                <td><strong style="color:#1e293b; font-size:15px;">${item.brand_name}</strong></td>
                <td style="color:#475569;">${item.active_ingredient || '-'}</td>
                <td style="color:#1565c0; font-weight:600;">${item.atc_code || '-'}</td>
                <td style="font-family:monospace; color:#334155;">${item.ttt_code || '-'}</td>
                <td style="color:#64748b; font-size:13px;">${item.package_size || item.morphology || '-'}</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

// MODAL MEGNYITÁSA
function openEditModal(index) {
    const item = drugItems[index];
    if (!item) return;

    document.getElementById("editDrugId").value = item.id;
    document.getElementById("editBrandName").value = item.brand_name || '';
    document.getElementById("editIngredient").value = item.active_ingredient || '';
    document.getElementById("editAtcCode").value = item.atc_code || '';
    document.getElementById("editTttCode").value = item.ttt_code || '';
    document.getElementById("editMorphology").value = item.morphology || item.package_size || '';
    document.getElementById("editBarcode").value = item.barcode || '';

    const activeGroup = document.getElementById("activeGroup");
    if (currentTab === 'local') {
        activeGroup.style.display = 'block';
        document.getElementById("editIsActive").value = (item.is_active !== false).toString();
    } else {
        activeGroup.style.display = 'none';
    }

    document.getElementById("editModal").style.display = 'flex';
}

function closeEditModal() {
    document.getElementById("editModal").style.display = 'none';
}

// MÓDOSÍTÁSOK MENTÉSE SUPABASE-BE
async function saveDrugChanges() {
    const drugId = document.getElementById("editDrugId").value;
    const brandName = document.getElementById("editBrandName").value.trim();
    const activeIngredient = document.getElementById("editIngredient").value.trim();
    const atcCode = document.getElementById("editAtcCode").value.trim();
    const tttCode = document.getElementById("editTttCode").value.trim();
    const morphology = document.getElementById("editMorphology").value.trim();
    const barcode = document.getElementById("editBarcode").value.trim();

    try {
        if (currentTab === 'local') {
            const isActive = document.getElementById("editIsActive").value === 'true';

            const { error } = await window.supabaseClient
                .from('local_inventory_master')
                .update({
                    brand_name: brandName,
                    active_ingredient: activeIngredient,
                    atc_code: atcCode,
                    ttt_code: tttCode,
                    morphology: morphology,
                    barcode: barcode,
                    is_active: isActive
                })
                .eq('id', drugId);

            if (error) throw error;

        } else {
            const { error } = await window.supabaseClient
                .from('pupha_master')
                .update({
                    brand_name: brandName,
                    active_ingredient: activeIngredient,
                    atc_code: atcCode,
                    ttt_code: tttCode,
                    package_size: morphology
                })
                .eq('id', drugId);

            if (error) throw error;
        }

        alert("Módosítások sikeresen mentve!");
        closeEditModal();
        loadDrugsData();

    } catch (err) {
        console.error("Hiba a mentés során:", err);
        alert("Hiba történt a módosítások mentésekor!");
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
