<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrugAssist - Beteg Jóváhagyása</title>

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f9;
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 { margin: 0; font-size: 22px; }
.user-info { color: #666; font-size: 14px; }

.container {
    max-width: 1200px;
    margin: auto;
    padding: 32px;
}

.back { margin-bottom: 24px; }
.back a { text-decoration: none; color: #1976d2; font-weight: 600; }

.card {
    background: white;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,.05);
}

.patient-name {
    font-size: 28px;
    font-weight: 700;
    color: #1e293b;
}

.patient-data {
    display: grid;
    grid-template-columns: 220px 1fr;
    row-gap: 10px;
    margin-top: 15px;
    font-size: 15px;
}

.label { color: #64748b; font-weight: 600; }

.action-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    margin-bottom: 24px;
}

.action-card {
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.action-card h2 { margin-top: 0; font-size: 18px; color: #334155; }

button {
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
}

button:hover { background: #1565c0; }

#scannerInput {
    width: 220px;
    padding: 8px;
    font-size: 16px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
}

/* GYÓGYSZER TÁBLÁZAT */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td { padding: 12px; text-align: left; font-size: 14px; }
th { background-color: #f8fafc; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #f1f5f9; }

.dose-cell {
    text-align: center;
    font-weight: bold;
    color: #0f172a;
}

.own-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
}

#patientNote {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    resize: vertical;
    box-sizing: border-box;
    font-family: inherit;
}

.complete {
    display: flex;
    justify-content: center;
    margin-top: 28px;
}

.complete-btn {
    background: #2e7d32;
    padding: 14px 36px;
    font-size: 16px;
}

.complete-btn:hover { background: #1b5e20; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Beteg Jóváhagyása</h1>
    <div class="user-info">
        <span id="userName">Dr. Kovács Anna</span> | <span id="dateTime"></span>
    </div>
</header>

<div class="container">

<div class="back">
    <a href="approval-list.html">← Vissza a jóváhagyásra váró listához</a>
</div>

<!-- BETEG ADATOK -->
<section class="card">
    <div class="patient-name">
        <span id="patientName">Beteg betöltése...</span>
    </div>
    <div class="patient-data">
        <div class="label">Azonosító</div>
        <div id="patientTaj">TAJ: -</div>
        <div class="label">Osztály</div>
        <div id="patientWard">-</div>
        <div class="label">Ágy</div>
        <div id="patientBed">-</div>
        <div class="label">Készítési azonosító</div>
        <div id="preparationId" style="font-weight: bold; color: #1976d2;">-</div>
    </div>
</section>

<div class="action-row">
    <!-- CÍMKE -->
    <section class="card action-card">
        <h2>🖨 Betegazonosító címke</h2>
        <button id="printLabelButton" onclick="window.print()">Címke nyomtatása</button>
    </section>

    <!-- VONALKÓD BEOLVASÁS -->
    <section class="card action-card">
        <h2>📦 Vonalkód beolvasás</h2>
        <input id="scannerInput" type="text" placeholder="Vonalkód beolvasása..." autocomplete="off">
    </section>
</div>

<!-- GYÓGYSZEREK -->
<section class="card">
    <h2>💊 Feladott Gyógyszerek</h2>
    <div id="medicationList">
        <p style="color:#64748b;">Gyógyszerek betöltése...</p>
    </div>
</section>

<!-- MEGJEGYZÉS -->
<div class="card">
    <h3>📝 Megjegyzés a patika részére</h3>
    <textarea id="patientNote" rows="3" placeholder="Itt adhat meg megjegyzést a gyógyszereléshez..."></textarea>
</div>

<!-- LEZÁRÁS -->
<div class="complete">
    <button id="completeButton" class="complete-btn" onclick="approvePrescription()">✓ Gyógyszerelés Jóváhagyása</button>
</div>

</div>

<script>
let currentPrescriptionId = null;

document.addEventListener("DOMContentLoaded", async () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const patientId = urlParams.get('patientId');
    currentPrescriptionId = urlParams.get('prescriptionId');

    if (patientId) {
        await loadPatientAndPrescription(patientId, currentPrescriptionId);
    }
});

async function loadPatientAndPrescription(patientId, prescriptionId) {
    try {
        // 1. Beteg adatai
        const { data: patient } = await window.supabaseClient
            .from('patients')
            .select('*')
            .eq('id', patientId)
            .single();

        if (patient) {
            document.getElementById("patientName").innerText = patient.name;
            document.getElementById("patientTaj").innerText = `TAJ: ${patient.taj}`;
            document.getElementById("patientWard").innerText = patient.department;
            document.getElementById("patientBed").innerText = patient.room_bed;
        }

        // 2. Igénylés és tételek lekérése
        let query = window.supabaseClient
            .from('prescriptions')
            .select('*, prescription_items(*, pupha_master(*))')
            .eq('patient_id', patientId);

        if (prescriptionId) {
            query = query.eq('id', prescriptionId);
        } else {
            query = query.order('created_at', { ascending: false }).limit(1);
        }

        const { data: pData } = await query;
        const prescription = pData && pData.length > 0 ? pData[0] : null;

        if (prescription) {
            currentPrescriptionId = prescription.id;
            document.getElementById("preparationId").innerText = prescription.barcode || 'DA-20261009-0001';

            renderMedicationTable(prescription.prescription_items || []);
        } else {
            document.getElementById("medicationList").innerHTML = '<p style="color:#64748b;">Nincs aktív feladott igénylés ehhez a beteghez.</p>';
        }

    } catch (err) {
        console.error("Hiba a adatok betöltésekor:", err);
    }
}

function renderMedicationTable(items) {
    const container = document.getElementById("medicationList");
    if (!items || items.length === 0) {
        container.innerHTML = '<p style="color:#64748b;">Nincsenek rögzített gyógyszertételek.</p>';
        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Gyógyszer neve</th>
                    <th>ATC kód</th>
                    <th style="text-align:center;">Reggel</th>
                    <th style="text-align:center;">Délben</th>
                    <th style="text-align:center;">Este</th>
                    <th style="text-align:center;">Éjjel</th>
                    <th style="text-align:center;">Státusz</th>
                </tr>
            </thead>
            <tbody>
    `;

    items.forEach(item => {
        const drugName = item.pupha_master ? item.pupha_master.brand_name : (item.original_order_text || 'Ismeretlen gyógyszer');
        const atc = item.pupha_master ? item.pupha_master.atc_code : '-';

        html += `
            <tr>
                <td><strong style="color:#1e293b;">${drugName}</strong></td>
                <td style="color:#64748b; font-size:13px;">${atc}</td>
                <td class="dose-cell">${item.dose_morning || 0}</td>
                <td class="dose-cell">${item.dose_noon || 0}</td>
                <td class="dose-cell">${item.dose_evening || 0}</td>
                <td class="dose-cell">${item.dose_night || 0}</td>
                <td style="text-align:center;">
                    ${item.is_own_medication ? '<span class="own-badge">Saját gyógyszer</span>' : '<span style="color:#16a34a; font-weight:600; font-size:13px;">Központi kiadás</span>'}
                </td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
}

// Igénylés jóváhagyása
async function approvePrescription() {
    if (!currentPrescriptionId) {
        alert("Nincs kiválasztott igénylés!");
        return;
    }

    const user = Auth.getCurrentUser();

    try {
        const { error } = await window.supabaseClient
            .from('prescriptions')
            .update({
                status: 'reviewed',
                reviewed_by: user ? user.id : null
            })
            .eq('id', currentPrescriptionId);

        if (error) throw error;

        alert("Gyógyszerelés sikeresen jóváhagyva!");
        window.location.href = 'approval-list.html';

    } catch (err) {
        console.error("Hiba a jóváhagyás során:", err);
        alert("Hiba történt a jóváhagyás mentésekor.");
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
