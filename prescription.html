<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Gyógyszerigénylés Feladása</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config, Auth & Prescription -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/prescription.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 { margin: 0; font-size: 20px; color: #1565c0; }

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-info {
    font-size: 13px;
    color: #475569;
    font-weight: 600;
}

.container { padding: 30px; max-width: 1100px; margin: auto; }

.card {
    background: white;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

.patient-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.patient-title { font-size: 24px; font-weight: 700; color: #1565c0; }
.patient-sub { color: #475569; font-size: 14px; margin-top: 6px; }

.copy-btn {
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #bbdefb;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.copy-btn:hover:not(:disabled) { background: #bbdefb; }
.copy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* FIGYELMEZTETŐ DOBOZ */
.lock-banner {
    display: none;
    background: #fff3e0;
    border: 1px solid #ffe0b2;
    color: #e65100;
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
    font-size: 14px;
}

/* SEARCH BOX */
.search-container { position: relative; margin-bottom: 20px; }
.search-input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #1976d2;
    box-sizing: border-box;
    outline: none;
}

.search-input:disabled {
    background: #f1f5f9;
    border-color: #cbd5e1;
    cursor: not-allowed;
}

.dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: white;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    max-height: 280px;
    overflow-y: auto;
    z-index: 100;
    display: none;
}

.dropdown-item {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.dropdown-item:hover { background: #f0f7ff; }
.sub-text { font-size: 12px; color: #777; margin-top: 2px; }

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td { padding: 12px; text-align: left; font-size: 14px; }
th { background-color: #f0f2f5; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #eee; }

table input[type="number"] {
    width: 55px;
    padding: 6px;
    text-align: center;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-weight: bold;
}

table input[type="number"]:disabled {
    background: #f8fafc;
    border-color: #e2e8f0;
}

.drug-title { font-size: 15px; color: #2c3e50; font-weight: 600; }
.ingredient-badge { font-size: 12px; color: #1976d2; font-weight: 600; margin-top: 2px; }

.remove-btn { background: none; border: none; cursor: pointer; font-size: 16px; }
.remove-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.submit-row { display: flex; justify-content: flex-end; margin-top: 20px; }
.submit-btn {
    background: #2e7d32;
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.submit-btn:hover:not(:disabled) { background: #256428; }
.submit-btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Osztályos Gyógyszerigénylés</h1>
    <div class="header-right">
        <a href="doctor-dashboard.html" onclick="event.preventDefault(); navigateBack();" style="text-decoration:none; font-size:18px; margin-right:5px;" title="Vissza a betegekhez">🏠</a>
        <div class="user-info">
            <span id="userName">Orvos</span> | <span id="dateTime"></span>
        </div>
    </div>
</header>

<div class="container">

<!-- LOCK BANNER (HA MÁR JÓVÁHAGYTA A PATIKA) -->
<div id="lockBanner" class="lock-banner">
    🔒 A kiválasztott napra vonatkozó igénylést a patika már feldolgozta / elfogadta, ezért a rendelés már nem módosítható.
</div>

<!-- BETEG FEJLÉC -->
<div class="card patient-header">
    <div>
        <div id="patientName" class="patient-title">Beteg betöltése...</div>
        <div id="patientInfo" class="patient-sub">-</div>
    </div>
    <button id="copyPrevBtn" class="copy-btn" onclick="Prescription.copyPreviousDay()">📋 Előző jóváhagyott terápia másolása</button>
</div>

<!-- GYÓGYSZER KERESŐ -->
<div class="card">
    <h3 style="margin-top:0; color:#1e293b;">💊 Gyógyszer hozzáadása</h3>
    <div class="search-container">
        <input type="text" id="puphaSearchInput" class="search-input" placeholder="🔎" oninput="Prescription.searchDrugs(this.value.trim())">
        <div id="puphaSearchResults" class="dropdown-menu"></div>
    </div>

    <!-- GYÓGYSZERELÉSI TÁBLÁZAT -->
    <table>
        <thead>
            <tr>
                <th>Gyógyszer / Hatóanyag</th>
                <th style="width:60px; text-align:center;">Reggel</th>
                <th style="width:60px; text-align:center;">Délben</th>
                <th style="width:60px; text-align:center;">Este</th>
                <th style="width:60px; text-align:center;">Éjjel</th>
                <th style="width:110px; text-align:center;">Saját gyógyszer</th>
                <th style="width:50px;"></th>
            </tr>
        </thead>
        <tbody id="prescriptionTableBody">
            <!-- prescription.js tölti fel -->
        </tbody>
    </table>

    <div class="submit-row">
        <button id="submitBtn" class="submit-btn" onclick="Prescription.submitOrder()">🚀 Gyógyszerigénylés feladása a Patikának</button>
    </div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name || user.email;
    }

    updateDateTime();
    setInterval(updateDateTime, 10000);

    const urlParams = new URLSearchParams(window.location.search);
    const patientId = urlParams.get('patientId');
    const targetDate = urlParams.get('date'); // YYYY-MM-DD paraméter

    if (patientId) {
        Prescription.loadPatientOrder(patientId, targetDate);
    } else {
        alert("Hiányzó beteg azonosító!");
        navigateBack();
    }
});

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}

function navigateBack() {
    window.location.replace("doctor-dashboard.html");
}
</script>

</body>
</html>
