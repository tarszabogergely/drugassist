<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Elkészült gyógyszerelések</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/pdf-generator.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 { margin: 0; font-size: 20px; color: #1565c0; }

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.container { padding: 30px; max-width: 1200px; margin: auto; }

/* DÁTUM LAPOZÓ SÁV */
.date-picker-card {
    background: white;
    border-radius: 14px;
    padding: 16px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.date-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.date-btn {
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #bbdefb;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
}

.date-btn:hover { background: #bbdefb; }

.date-input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-family: inherit;
    font-weight: 600;
    color: #1e293b;
    outline: none;
    cursor: pointer;
}

.section { margin-bottom: 30px; }

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 10px;
}

.pdf-btn {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    transition: 0.2s;
}

.pdf-btn:hover {
    background: #fee2e2;
    border-color: #fca5a5;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

th, td { padding: 14px; font-size: 14px; }
th { background-color: #f8fafc; text-align: left; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
tr:hover { background-color: #f8fafc; }

.status-cell { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; }

.green { background-color: #2e7d32; }

.badge {
    background-color: #2e7d32;
    color: white;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
}

.action-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background-color: #1976d2;
    color: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.action-btn:hover { background-color: #1565c0; }

.empty-msg {
    background: white;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    color: #64748b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    font-size: 15px;
}
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Elkészült gyógyszerelések</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-weight:600;">← Vissza a kezdőlapra</a></div>
        <div id="dateTime" style="color:#64748b; font-size:14px; font-weight: 600;"></div>
    </div>
</header>

<div class="container">

    <!-- DÁTUM LAPOZÓ CARD -->
    <div class="date-picker-card">
        <div style="font-weight: 700; color: #1e293b; font-size: 16px;">
            📅 Kiválasztott nap: <span id="displaySelectedDate" style="color:#1565c0;">-</span>
        </div>
        <div class="date-controls">
            <button class="date-btn" onclick="changeDate(-1)">◀ Előző nap</button>
            <input type="date" id="dateInput" class="date-input" onchange="onDateInputChange(this.value)">
            <button class="date-btn" onclick="changeDate(1)">Következő nap ▶</button>
            <button class="date-btn" style="background:#2e7d32; color:white; border:none;" onclick="setToday()">Mai nap</button>
        </div>
    </div>

    <!-- TARTALOM TERÜLET -->
    <div id="contentContainer">
        <div class="empty-msg">Adatok betöltése...</div>
    </div>

</div>

<script>
let selectedDate = new Date();

document.addEventListener("DOMContentLoaded", () => {
    Auth.requireAuth();
    
    // Mai nap beállítása kezdőértékként
    setToday();
});

function setToday() {
    selectedDate = new Date();
    updateDatePickerUI();
    loadCompletedList();
}

function changeDate(days) {
    selectedDate.setDate(selectedDate.getDate() + days);
    updateDatePickerUI();
    loadCompletedList();
}

function onDateInputChange(val) {
    if (!val) return;
    const parts = val.split('-');
    selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
    updateDatePickerUI();
    loadCompletedList();
}

function updateDatePickerUI() {
    const year = selectedDate.getFullYear();
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const day = String(selectedDate.getDate()).padStart(2, '0');
    
    document.getElementById("dateInput").value = `${year}-${month}-${day}`;
    document.getElementById("displaySelectedDate").innerText = selectedDate.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
}

async function loadCompletedList() {
    const container = document.getElementById("contentContainer");
    container.innerHTML = '<div class="empty-msg">Adatok betöltése...</div>';

    try {
        // Kiválasztott nap kezdetének és végének kiszámítása helyi időben
        const startOfDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 0, 0, 0).toISOString();
        const endOfDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 23, 59, 59, 999).toISOString();

        // 1. LÉPÉS: 'completed' igénylések lekérése a kiválasztott napra
        const { data: prescriptions, error: prescError } = await window.supabaseClient
            .from('prescriptions')
            .select('id, created_at, status, patient_id, prescription_items(id)')
            .eq('status', 'completed')
            .gte('created_at', startOfDay)
            .lte('created_at', endOfDay)
            .order('created_at', { ascending: false });

        if (prescError) throw prescError;

        if (!prescriptions || prescriptions.length === 0) {
            container.innerHTML = '<div class="empty-msg">Ezen a napon nem volt lezárt, ellenőrzött gyógyszerelés.</div>';
            return;
        }

        // 2. LÉPÉS: Betegek adatainak lekérése
        const patientIds = [...new Set(prescriptions.map(p => p.patient_id).filter(Boolean))];
        
        let patientsMap = {};
        if (patientIds.length > 0) {
            const { data: patients, error: patientError } = await window.supabaseClient
                .from('patients')
                .select('id, name, room_bed, department')
                .in('id', patientIds);

            if (!patientError && patients) {
                patients.forEach(pat => {
                    patientsMap[pat.id] = pat;
                });
            }
        }

        // 3. LÉPÉS: Osztályok szerinti csoportosítás
        const groupedByDept = {};
        prescriptions.forEach(p => {
            const patient = patientsMap[p.patient_id];
            const dept = (patient && patient.department) ? patient.department : 'Központi Osztály';
            
            if (!groupedByDept[dept]) {
                groupedByDept[dept] = [];
            }

            const itemCount = p.prescription_items ? p.prescription_items.length : 0;

            groupedByDept[dept].push({
                ...p,
                patientName: patient ? patient.name : 'Ismeretlen beteg',
                bed: patient ? patient.room_bed : '-',
                itemCount: itemCount
            });
        });

        // 4. LÉPÉS: HTML generálása PDF ikonnal az osztályok mellett
        let html = '';
        for (const [dept, list] of Object.entries(groupedByDept)) {
            html += `
                <div class="section">
                    <div class="section-header">
                        <div class="section-title">
                            🏥 ${dept} <span class="badge">${list.length} beteg</span>
                        </div>
                        <button class="pdf-btn" onclick="generateDepartmentPdf('${dept}')">
                            📄 Osztályos összesítő PDF
                        </button>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Beteg neve</th>
                                <th>Ágy</th>
                                <th>Gyógyszer tételek</th>
                                <th>Státusz</th>
                                <th>Időpont</th>
                                <th style="text-align: right;">Művelet</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            list.forEach(item => {
                const timeStr = item.created_at ? new Date(item.created_at).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' }) : '-';

                html += `
                    <tr>
                        <td><strong style="color:#1e293b; font-size:15px;">${item.patientName}</strong></td>
                        <td>${item.bed}</td>
                        <td><strong style="color:#0f172a;">${item.itemCount} db</strong></td>
                        <td>
                            <div class="status-cell">
                                <div class="status-dot green"></div>
                                🟢 Elkészült & Ellenőrizve
                            </div>
                        </td>
                        <td>${timeStr}</td>
                        <td style="text-align: right;">
                            <button class="action-btn" onclick="location.href='review.html?patientId=${item.patient_id}&prescriptionId=${item.id}'">📋 Megnyitás</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
        }

        container.innerHTML = html;

    } catch (err) {
        console.error("Hiba a lista betöltésekor:", err);
        container.innerHTML = `<div class="empty-msg">Hiba történt az adatok betöltése során (${err.message || 'Adatbázis hiba'}).</div>`;
    }
}

function generateDepartmentPdf(departmentName) {
    const formattedDate = selectedDate.toLocaleDateString('hu-HU');
    alert(`📄 Osztályos összesítő PDF generálása a(z) "${departmentName}" osztályra (${formattedDate})...`);
    // Itt hívható meg a PDF generáló logika / ablak
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
