<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Kezdőlap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

/* ===== HEADER & CONTEXT SWITCHER ===== */
header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    color: #1565c0;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-name {
    font-weight: 600;
    color: #2c3e50;
    font-size: 14px;
}

.badge-select {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #d0d7e2;
    background: #eef4fb;
    color: #1976d2;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    outline: none;
}

.badge-select.dept {
    background: #f0f7ed;
    color: #2e7d32;
    border-color: #c8e6c9;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.logout-btn:hover { background: #ffcdd2; }

/* ===== CONTAINER (SZÉLES ELRENDEZÉS) ===== */
.container {
    padding: 32px;
    width: 100%;
    box-sizing: border-box;
}

.section-title-main {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 16px;
}

/* ===== STATUS CARDS ===== */
.status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.status-card {
    background: white;
    padding: 22px 26px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.status-title { font-size: 15px; font-weight: 600; color: #475569; }
.status-number { font-size: 38px; font-weight: 700; text-align: right; color: #0f172a; }
.status-sub { font-size: 12px; color: #64748b; text-align: right; }

.orange { border-left: 6px solid #ff9800; }
.blue { border-left: 6px solid #2196f3; }
.green { border-left: 6px solid #4caf50; }
.gray { border-left: 6px solid #9e9e9e; }

/* ===== WARD GRID ===== */
.ward-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 22px;
    margin-bottom: 40px;
}

.ward-card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border: 1px solid #e2e8f0;
}

.ward-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    border-color: #cbd5e1;
}

.ward-left h3 {
    margin: 0 0 8px 0;
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
}

.ward-total {
    font-size: 14px;
    font-weight: 600;
    color: #1565c0;
    margin-bottom: 8px;
}

.ward-status-list {
    font-size: 13px;
    color: #475569;
    line-height: 1.6;
}

.ward-indicator {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
}

.success { background: #e8f5e9; color: #2e7d32; }
.warning { background: #fff3e0; color: #e65100; }
.processing { background: #e3f2fd; color: #1565c0; }

.no-data-msg {
    background: white;
    padding: 24px;
    border-radius: 14px;
    text-align: center;
    color: #64748b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

/* ===== BOTTOM ACTIONS ===== */
.bottom-actions {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 20px;
}

.icon-button {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #f1f5f9;
}

.icon-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.icon { font-size: 32px; }
.icon-text { margin-top: 8px; font-weight: 600; font-size: 13px; color: #334155; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist</h1>
    <div class="header-right">
        <span id="userName" class="user-name">Kovács Anna</span>
        
        <!-- SZEREPKÖR VÁLASZTÓ -->
        <select id="roleSelector" class="badge-select" onchange="changeRole(this.value)">
            <option value="pharmacist">🧪 Gyógyszerész</option>
            <option value="doctor">📋 Orvos / Igénylő</option>
            <option value="assistant">💊 Asszisztens</option>
            <option value="nurse">🏥 Ápoló</option>
        </select>

        <!-- OSZTÁLY VÁLASZTÓ -->
        <select id="deptSelector" class="badge-select dept" onchange="changeDepartment(this.value)">
            <option value="Belgyógyászat">Belgyógyászat</option>
            <option value="Sebészet">Sebészet</option>
            <option value="Neurológia">Neurológia</option>
            <option value="Kardiológia">Kardiológia</option>
            <option value="Központi Patika">Központi Patika</option>
        </select>

        <span id="clock" style="font-size: 13px; color: #777;"></span>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

<!-- ===== ÉLŐ STÁTUSZOK ===== -->
<div class="section-title-main">📊 Aktuális Gyógyszerelési Fázisok</div>
<div class="status-grid">
    <div class="status-card orange" onclick="location.href='approval-list.html'">
        <div class="status-title">Jóváhagyásra vár</div>
        <div><div id="cntSubmitted" class="status-number">0</div><div class="status-sub">igénylés</div></div>
    </div>

    <div class="status-card blue" onclick="location.href='medication-list.html'">
        <div class="status-title">Gyógyszerelésre vár</div>
        <div><div id="cntReviewed" class="status-number">0</div><div class="status-sub">igénylés</div></div>
    </div>

    <div class="status-card green" onclick="location.href='verification-list.html'">
        <div class="status-title">Ellenőrzésre vár</div>
        <div><div id="cntDispensed" class="status-number">0</div><div class="status-sub">igénylés</div></div>
    </div>

    <div class="status-card gray" onclick="location.href='completed-list.html'">
        <div class="status-title">Készen van</div>
        <div><div id="cntCompleted" class="status-number">0</div><div class="status-sub">igénylés</div></div>
    </div>
</div>

<!-- ===== OSZTÁLYOK DINAMIKUS LISTÁJA ===== -->
<div class="section-title-main">🏥 Aktív Igényléssel Rendelkező Osztályok</div>
<div id="wardGridContainer" class="ward-grid">
    <div class="no-data-msg">Adatok betöltése...</div>
</div>

<!-- ===== KISZEGGÉS ÉS GYORSIKONOK ===== -->
<div class="bottom-actions">
    <div class="icon-button" onclick="location.href='drugs.html'">
        <div class="icon">💊</div>
        <div class="icon-text">Gyógyszerek</div>
    </div>
    <div class="icon-button" onclick="location.href='report.html'">
        <div class="icon">📊</div>
        <div class="icon-text">Kimutatás</div>
    </div>
    <div class="icon-button" onclick="location.href='patients-list.html'">
        <div class="icon">👤</div>
        <div class="icon-text">Betegek</div>
    </div>
    <div class="icon-button">
        <div class="icon">⚙</div>
        <div class="icon-text">Beállítások</div>
    </div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name;
        
        const roleSel = document.getElementById("roleSelector");
        if (roleSel) roleSel.value = user.activeRole || 'pharmacist';

        const deptSel = document.getElementById("deptSelector");
        if (deptSel) deptSel.value = user.activeDepartment || 'Belgyógyászat';

        loadDashboardData();
    }
});

async function loadDashboardData() {
    try {
        const { data: prescriptions, error: pErr } = await window.supabaseClient
            .from('prescriptions')
            .select('id, status, patient_id');

        if (pErr) throw pErr;

        let cntSubmitted = 0;
        let cntReviewed = 0;
        let cntDispensed = 0;
        let cntCompleted = 0;

        const patientIds = [...new Set((prescriptions || []).map(p => p.patient_id).filter(Boolean))];

        if (prescriptions) {
            prescriptions.forEach(p => {
                if (p.status === 'submitted') cntSubmitted++;
                else if (p.status === 'reviewed') cntReviewed++;
                else if (p.status === 'dispensed') cntDispensed++;
                else if (p.status === 'completed') cntCompleted++;
            });
        }

        document.getElementById("cntSubmitted").innerText = cntSubmitted;
        document.getElementById("cntReviewed").innerText = cntReviewed;
        document.getElementById("cntDispensed").innerText = cntDispensed;
        document.getElementById("cntCompleted").innerText = cntCompleted;

        if (patientIds.length === 0) {
            document.getElementById("wardGridContainer").innerHTML = '<div class="no-data-msg">Jelenleg nincs aktív gyógyszerigénylés egyetlen osztályon sem.</div>';
            return;
        }

        const { data: patients, error: patErr } = await window.supabaseClient
            .from('patients')
            .select('id, department')
            .in('id', patientIds);

        if (patErr) throw patErr;

        const patientDeptMap = {};
        if (patients) {
            patients.forEach(pat => {
                patientDeptMap[pat.id] = pat.department || 'Egyéb Osztály';
            });
        }

        const wardStats = {};

        prescriptions.forEach(p => {
            const dept = patientDeptMap[p.patient_id];
            if (dept) {
                if (!wardStats[dept]) {
                    wardStats[dept] = {
                        total: 0,
                        submitted: 0,
                        reviewed: 0,
                        dispensed: 0,
                        completed: 0
                    };
                }
                wardStats[dept].total++;
                if (p.status === 'submitted') wardStats[dept].submitted++;
                else if (p.status === 'reviewed') wardStats[dept].reviewed++;
                else if (p.status === 'dispensed') wardStats[dept].dispensed++;
                else if (p.status === 'completed') wardStats[dept].completed++;
            }
        });

        const wardContainer = document.getElementById("wardGridContainer");
        let html = '';

        for (const [dept, stats] of Object.entries(wardStats)) {
            let indicatorClass = 'processing';
            let indicatorIcon = '⏳';

            if (stats.submitted > 0) {
                indicatorClass = 'warning';
                indicatorIcon = '📋';
            } else if (stats.reviewed > 0) {
                indicatorClass = 'processing';
                indicatorIcon = '💊';
            } else if (stats.total === stats.completed) {
                indicatorClass = 'success';
                indicatorIcon = '✓';
            }

            let statusDetails = [];
            if (stats.submitted > 0) statusDetails.push(`<strong>${stats.submitted}</strong> Jóváhagyásra vár`);
            if (stats.reviewed > 0) statusDetails.push(`<strong>${stats.reviewed}</strong> Gyógyszerelésre vár`);
            if (stats.dispensed > 0) statusDetails.push(`<strong>${stats.dispensed}</strong> Ellenőrzésre vár`);
            if (stats.completed > 0) statusDetails.push(`<strong>${stats.completed}</strong> Kész`);

            html += `
                <div class="ward-card" onclick="location.href='ward.html?department=${encodeURIComponent(dept)}'">
                    <div class="ward-left">
                        <h3>${dept}</h3>
                        <div class="ward-total">Összes igény: ${stats.total} db</div>
                        <div class="ward-status-list">
                            ${statusDetails.join('<br>')}
                        </div>
                    </div>
                    <div class="ward-indicator ${indicatorClass}">${indicatorIcon}</div>
                </div>
            `;
        }

        wardContainer.innerHTML = html;

    } catch (err) {
        console.error("Hiba a dashboard adatok betöltésekor:", err);
        document.getElementById("wardGridContainer").innerHTML = '<div class="no-data-msg">Hiba történt az osztályos adatok betöltése során.</div>';
    }
}

function changeRole(newRole) {
    Auth.updateContext(newRole, null);
    if (newRole === 'doctor' || newRole === 'nurse') {
        window.location.href = 'doctor-dashboard.html';
    }
}

function changeDepartment(newDept) {
    Auth.updateContext(null, newDept);
}

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateClock();
setInterval(updateClock, 10000);
</script>

</body>
</html>
