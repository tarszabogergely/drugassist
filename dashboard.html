<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Kezdőlap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

/* ===== HEADER & CONTEXT SWITCHER ===== */
header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    color: #1565c0;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-name {
    font-weight: 600;
    color: #2c3e50;
    font-size: 14px;
}

/* FIXÁLT, NEM KATTINTHATÓ JELVÉNYEK */
.badge-select {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #d0d7e2;
    background: #eef4fb;
    color: #1976d2;
    font-weight: 600;
    font-size: 13px;
    outline: none;
    cursor: default;
    opacity: 0.95;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
}

.badge-select.dept {
    background: #f0f7ed;
    color: #2e7d32;
    border-color: #c8e6c9;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.logout-btn:hover { background: #ffcdd2; }

/* ===== CONTAINER ===== */
.container {
    padding: 32px;
    width: 100%;
    box-sizing: border-box;
}

.section-title-main {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 16px;
}

/* ===== STATUS CARDS ===== */
.status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.status-card {
    background: white;
    padding: 22px 26px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.status-title { font-size: 15px; font-weight: 600; color: #475569; }
.status-number { font-size: 38px; font-weight: 700; text-align: right; color: #0f172a; }

.orange { border-left: 6px solid #ff9800; }
.blue { border-left: 6px solid #2196f3; }
.green { border-left: 6px solid #4caf50; }
.gray { border-left: 6px solid #9e9e9e; }

/* ===== WARD GRID ===== */
.ward-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 22px;
    margin-bottom: 40px;
}

.ward-card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border: 1px solid #e2e8f0;
}

.ward-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    border-color: #cbd5e1;
}

.ward-left h3 {
    margin: 0 0 8px 0;
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
}

.ward-total {
    font-size: 14px;
    font-weight: 700;
    color: #1565c0;
    margin-bottom: 8px;
}

.ward-status-list {
    font-size: 13px;
    color: #475569;
    line-height: 1.6;
}

.ward-indicator {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
}

.success { background: #e8f5e9; color: #2e7d32; }
.warning { background: #fff3e0; color: #e65100; }
.processing { background: #e3f2fd; color: #1565c0; }
.neutral { background: #f1f5f9; color: #64748b; }

.no-data-msg {
    background: white;
    padding: 24px;
    border-radius: 14px;
    text-align: center;
    color: #64748b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

/* ===== BOTTOM ACTIONS ===== */
.bottom-actions {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 20px;
}

.icon-button {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #f1f5f9;
}

.icon-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.icon { font-size: 32px; }
.icon-text { margin-top: 8px; font-weight: 600; font-size: 13px; color: #334155; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist</h1>
    <div class="header-right">
        <span id="userName" class="user-name">Munkatárs</span>
        
        <!-- FIXÁLT SZEREPKÖR VÁLASZTÓ (DISABLED) -->
        <select id="roleSelector" class="badge-select" disabled>
            <option value="pharmacist">🧪 Gyógyszerész</option>
            <option value="doctor">📋 Orvos / Igénylő</option>
            <option value="assistant">💊 Asszisztens</option>
            <option value="nurse">🏥 Ápoló</option>
        </select>

        <!-- FIXÁLT OSZTÁLY VÁLASZTÓ (DISABLED) -->
        <select id="deptSelector" class="badge-select dept" disabled>
            <option value="Belgyógyászat">Belgyógyászat</option>
            <option value="Sebészet">Sebészet</option>
            <option value="Neurológia">Neurológia</option>
            <option value="Kardiológia">Kardiológia</option>
            <option value="Központi Patika">Központi Patika</option>
        </select>

        <span id="clock" style="font-size: 13px; color: #777;"></span>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

<!-- ===== ÉLŐ STÁTUSZOK (MAI NAP) ===== -->
<div class="section-title-main">📊 Mai Gyógyszerelési Fázisok</div>
<div class="status-grid">
    <div class="status-card orange" onclick="location.href='approval-list.html'">
        <div class="status-title">Jóváhagyásra vár</div>
        <div id="cntSubmitted" class="status-number">0</div>
    </div>

    <div class="status-card blue" onclick="location.href='medication-list.html'">
        <div class="status-title">Gyógyszerelésre vár</div>
        <div id="cntReviewed" class="status-number">0</div>
    </div>

    <div class="status-card green" onclick="location.href='verification-list.html'">
        <div class="status-title">Ellenőrzésre vár</div>
        <div id="cntDispensed" class="status-number">0</div>
    </div>

    <div class="status-card gray" onclick="location.href='completed-list.html'">
        <div class="status-title">Kész</div>
        <div id="cntCompleted" class="status-number">0</div>
    </div>
</div>

<!-- ===== OSZTÁLYOK DINAMIKUS LISTÁJA ===== -->
<div class="section-title-main">🏥 Osztályok Mai Állapota</div>
<div id="wardGridContainer" class="ward-grid">
    <div class="no-data-msg">Adatok betöltése...</div>
</div>

<!-- ===== AKCIÓK ÉS GYORSIKONOK ===== -->
<div class="bottom-actions">
    <div class="icon-button" onclick="location.href='drugs.html'">
        <div class="icon">💊</div>
        <div class="icon-text">Gyógyszerek</div>
    </div>
    <div class="icon-button" onclick="location.href='report.html'">
        <div class="icon">📊</div>
        <div class="icon-text">Kimutatás</div>
    </div>
    <div class="icon-button" onclick="location.href='patients-list.html'">
        <div class="icon">👤</div>
        <div class="icon-text">Betegek</div>
    </div>
    <div class="icon-button">
        <div class="icon">⚙</div>
        <div class="icon-text">Beállítások</div>
    </div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name || user.email;

        // FELHASZNÁLÓI PROFIL LEKÉRDEZÉSE A SUPABASE-BŐL A FEJLÉC FIXÁLÁSÁHOZ
        try {
            const { data: profile } = await window.supabaseClient
                .from('profiles')
                .select('*')
                .or(`id.eq.${user.id},user_id.eq.${user.id}`)
                .maybeSingle();

            if (profile) {
                if (profile.full_name) {
                    document.getElementById("userName").innerText = profile.full_name;
                }
                const roleSel = document.getElementById("roleSelector");
                if (roleSel && profile.role) {
                    roleSel.value = profile.role;
                }
                const deptSel = document.getElementById("deptSelector");
                if (deptSel && profile.department) {
                    // Ha az adott osztály még nincs a listában, hozzáadjuk opcióként, hogy mindig helyesen jelenjen meg
                    let exists = Array.from(deptSel.options).some(opt => opt.value === profile.department);
                    if (!exists) {
                        const opt = document.createElement('option');
                        opt.value = profile.department;
                        opt.innerText = profile.department;
                        deptSel.appendChild(opt);
                    }
                    deptSel.value = profile.department;
                }
            } else {
                const roleSel = document.getElementById("roleSelector");
                if (roleSel) roleSel.value = user.activeRole || 'pharmacist';

                const deptSel = document.getElementById("deptSelector");
                if (deptSel) deptSel.value = user.activeDepartment || 'Belgyógyászat';
            }
        } catch (e) {
            console.error("Profil betöltési hiba:", e);
        }

        loadDashboardData();
    }
});

async function loadDashboardData() {
    try {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString();

        // 1. LEKÉRJÜK AZ ÖSSZES AKTÍV BETEGET ÉS CSOPORTOSÍTJUK OSZTÁLYONKÉNT
        const { data: activePatients, error: patErr } = await window.supabaseClient
            .from('patients')
            .select('id, name, department')
            .eq('status', 'active');

        if (patErr) throw patErr;

        if (!activePatients || activePatients.length === 0) {
            document.getElementById("wardGridContainer").innerHTML = '<div class="no-data-msg">Jelenleg egyetlen osztályon sincs felvéve aktív beteg.</div>';
            return;
        }

        const deptPatientsMap = {};
        activePatients.forEach(p => {
            const dept = p.department || 'Egyéb Osztály';
            if (!deptPatientsMap[dept]) {
                deptPatientsMap[dept] = [];
            }
            deptPatientsMap[dept].push(p.id);
        });

        // 2. LEKÉRJÜK A MAI NAPON LÉTREHOZOTT IGÉNYLÉSEKET
        const { data: todayPrescriptions, error: pErr } = await window.supabaseClient
            .from('prescriptions')
            .select('id, status, patient_id')
            .gte('created_at', startOfToday);

        if (pErr) throw pErr;

        let cntSubmitted = 0;
        let cntReviewed = 0;
        let cntDispensed = 0;
        let cntCompleted = 0;

        const patientTodayPrescMap = {};

        if (todayPrescriptions) {
            todayPrescriptions.forEach(p => {
                if (p.status === 'submitted') cntSubmitted++;
                else if (p.status === 'reviewed') cntReviewed++;
                else if (p.status === 'dispensed') cntDispensed++;
                else if (p.status === 'completed') cntCompleted++;

                if (!patientTodayPrescMap[p.patient_id]) {
                    patientTodayPrescMap[p.patient_id] = p.status;
                }
            });
        }

        // Felső kártyák számainak frissítése
        document.getElementById("cntSubmitted").innerText = cntSubmitted;
        document.getElementById("cntReviewed").innerText = cntReviewed;
        document.getElementById("cntDispensed").innerText = cntDispensed;
        document.getElementById("cntCompleted").innerText = cntCompleted;

        // 3. OSZTÁLYOK KÁRTYÁINAK ÖSSZEÁLLÍTÁSA
        const wardContainer = document.getElementById("wardGridContainer");
        let html = '';

        for (const [dept, patientIds] of Object.entries(deptPatientsMap)) {
            const totalPatients = patientIds.length;
            
            let submittedCount = 0;
            let reviewedCount = 0;
            let dispensedCount = 0;
            let completedCount = 0;
            let orderedPatientsCount = 0;

            patientIds.forEach(pId => {
                const st = patientTodayPrescMap[pId];
                if (st) {
                    orderedPatientsCount++;
                    if (st === 'submitted') submittedCount++;
                    else if (st === 'reviewed') reviewedCount++;
                    else if (st === 'dispensed') dispensedCount++;
                    else if (st === 'completed') completedCount++;
                }
            });

            let indicatorClass = 'neutral';
            let indicatorIcon = '🏥';

            if (submittedCount > 0) {
                indicatorClass = 'warning';
                indicatorIcon = '📋';
            } else if (reviewedCount > 0) {
                indicatorClass = 'processing';
                indicatorIcon = '💊';
            } else if (dispensedCount > 0) {
                indicatorClass = 'processing';
                indicatorIcon = '🔍';
            } else if (orderedPatientsCount > 0 && orderedPatientsCount === completedCount) {
                indicatorClass = 'success';
                indicatorIcon = '✓';
            }

            let statusDetails = [];
            if (submittedCount > 0) statusDetails.push(`<strong>${submittedCount}</strong> Jóváhagyásra vár`);
            if (reviewedCount > 0) statusDetails.push(`<strong>${reviewedCount}</strong> Gyógyszerelésre vár`);
            if (dispensedCount > 0) statusDetails.push(`<strong>${dispensedCount}</strong> Ellenőrzésre vár`);
            if (completedCount > 0) statusDetails.push(`<strong>${completedCount}</strong> Kész`);
            if (orderedPatientsCount === 0) statusDetails.push(`<span style="color:#94a3b8;">Még nincs mai igénylés</span>`);

            html += `
                <div class="ward-card" onclick="location.href='ward.html?department=${encodeURIComponent(dept)}'">
                    <div class="ward-left">
                        <h3>${dept}</h3>
                        <div class="ward-total">Összes igény: ${orderedPatientsCount}/${totalPatients}</div>
                        <div class="ward-status-list">
                            ${statusDetails.join('<br>')}
                        </div>
                    </div>
                    <div class="ward-indicator ${indicatorClass}">${indicatorIcon}</div>
                </div>
            `;
        }

        wardContainer.innerHTML = html;

    } catch (err) {
        console.error("Hiba a dashboard adatok betöltésekor:", err);
        document.getElementById("wardGridContainer").innerHTML = '<div class="no-data-msg">Hiba történt az osztályos adatok betöltése során.</div>';
    }
}

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateClock();
setInterval(updateClock, 10000);
</script>

</body>
</html>
