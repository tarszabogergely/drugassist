<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Kezdőlap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

/* ===== HEADER & CONTEXT SWITCHER ===== */
header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-name {
    font-weight: 600;
    color: #2c3e50;
    font-size: 14px;
}

.badge-select {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #d0d7e2;
    background: #eef4fb;
    color: #1976d2;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    outline: none;
}

.badge-select.dept {
    background: #f0f7ed;
    color: #2e7d32;
    border-color: #c8e6c9;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.logout-btn:hover {
    background: #ffcdd2;
}

/* ===== CONTAINER ===== */
.container {
    padding: 32px;
}

/* ===== STATUS CARDS ===== */
.status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 50px;
}

.status-card {
    background: white;
    padding: 26px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.status-title { font-size: 16px; font-weight: 500; }
.status-number { font-size: 40px; font-weight: 700; text-align: right; }
.status-sub { font-size: 12px; color: #888; }

.orange { border-left: 6px solid #ff9800; }
.blue { border-left: 6px solid #2196f3; }
.green { border-left: 6px solid #4caf50; }
.gray { border-left: 6px solid #9e9e9e; }

/* ===== WARD GRID ===== */
.ward-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    margin-top: 20px;
}

.ward-card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.ward-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
.ward-card h3 { margin-top: 0; font-size: 18px; font-weight: 600; }
.ward-status { font-size: 14px; line-height: 1.6; color: #555; }

.ward-indicator {
    width: 70px; height: 70px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: bold;
}

.success { background: #e8f5e9; color: #4caf50; }
.warning { background: #fff3e0; color: #ff9800; }
.processing { background: #e3f2fd; color: #2196f3; }

/* ===== BOTTOM ACTIONS ===== */
.bottom-actions {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 25px;
}

.icon-button {
    background: white; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    cursor: pointer; transition: 0.2s; height: 120px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
}

.icon-button:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
.icon { font-size: 34px; }
.icon-text { margin-top: 8px; font-weight: 500; font-size: 14px; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist</h1>
    <div class="header-right">
        <span id="userName" class="user-name">Kovács Anna</span>
        
        <!-- SZEREPKÖR VÁLASZTÓ -->
        <select id="roleSelector" class="badge-select" onchange="changeRole(this.value)">
            <option value="pharmacist">🧪 Gyógyszerész</option>
            <option value="doctor">📋 Orvos / Igénylő</option>
            <option value="assistant">💊 Asszisztens</option>
            <option value="nurse">🏥 Ápoló</option>
        </select>

        <!-- OSZTÁLY VÁLASZTÓ -->
        <select id="deptSelector" class="badge-select dept" onchange="changeDepartment(this.value)">
            <option value="Belgyógyászat">Belgyógyászat</option>
            <option value="Sebészet">Sebészet</option>
            <option value="Neurológia">Neurológia</option>
            <option value="Kardiológia">Kardiológia</option>
            <option value="Központi Patika">Központi Patika</option>
        </select>

        <span id="clock" style="font-size: 13px; color: #777;"></span>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

<!-- ===== STÁTUSZOK ===== -->
<div class="status-grid">
    <div class="status-card orange" onclick="location.href='approval-list.html'">
        <div class="status-title">Jóváhagyásra vár</div>
        <div><div class="status-number">18</div><div class="status-sub">beteg</div></div>
    </div>

    <div class="status-card blue" onclick="location.href='medication-list.html'">
        <div class="status-title">Gyógyszerelésre vár</div>
        <div><div class="status-number">12</div><div class="status-sub">beteg</div></div>
    </div>

    <div class="status-card green" onclick="location.href='verification-list.html'">
        <div class="status-title">Ellenőrzésre vár</div>
        <div><div class="status-number">6</div><div class="status-sub">beteg</div></div>
    </div>

    <div class="status-card gray" onclick="location.href='completed-list.html'">
        <div class="status-title">Készen van</div>
        <div><div class="status-number">44</div><div class="status-sub">beteg</div></div>
    </div>
</div>

<!-- ===== OSZTÁLYOK ===== -->
<div class="ward-grid">
    <div class="ward-card" onclick="location.href='ward.html'">
        <div class="ward-left">
            <h3>Belgyógyászat</h3>
            <div class="ward-status">Betegek: 38 | Kész: 38</div>
        </div>
        <div class="ward-indicator success">✓</div>
    </div>

    <div class="ward-card" onclick="location.href='ward.html'">
        <div class="ward-left">
            <h3>Sebészet</h3>
            <div class="ward-status">Betegek: 24 | Függő: 2</div>
        </div>
        <div class="ward-indicator warning">⏳</div>
    </div>
</div>

<!-- ===== BOTTOM MODULES ===== -->
<div class="bottom-actions">
    <div class="icon-button" onclick="location.href='cikktorzs.html'">
        <div class="icon">💊</div>
        <div class="icon-text">Gyógyszerek</div>
    </div>
    <div class="icon-button">
        <div class="icon">📊</div>
        <div class="icon-text">Kimutatás</div>
    </div>
    <div class="icon-button" onclick="location.href='patients.html'">
        <div class="icon">👤</div>
        <div class="icon-text">Betegek</div>
    </div>
    <div class="icon-button">
        <div class="icon">⚙</div>
        <div class="icon-text">Beállítások</div>
    </div>
</div>

</div>

<script>
// Munkamenet betöltése és fejléc frissítése
document.addEventListener("DOMContentLoaded", () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name;
        
        // Szerepkör választó beállítása
        const roleSel = document.getElementById("roleSelector");
        if (roleSel) {
            roleSel.value = user.activeRole || 'pharmacist';
        }

        // Osztály választó beállítása
        const deptSel = document.getElementById("deptSelector");
        if (deptSel) {
            deptSel.value = user.activeDepartment || 'Belgyógyászat';
        }
    }
});

function changeRole(newRole) {
    Auth.updateContext(newRole, null);
}

function changeDepartment(newDept) {
    Auth.updateContext(null, newDept);
}

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateClock();
setInterval(updateClock, 10000);
</script>

</body>
</html>
