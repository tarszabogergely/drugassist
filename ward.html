<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Osztályos Betegek</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/pdf-generator.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 18px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    color: #1e293b; /* Vagy #000000 feketéhez */
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.container { padding: 30px; max-width: 1100px; margin: auto; }

/* DÁTUM LAPOZÓ SÁV */
.date-picker-card {
    background: white;
    border-radius: 14px;
    padding: 16px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.date-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.date-btn {
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #bbdefb;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
}

.date-btn:hover { background: #bbdefb; }

.date-input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-family: inherit;
    font-weight: 600;
    color: #1e293b;
    outline: none;
    cursor: pointer;
}

.pdf-btn {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    transition: 0.2s;
}

.pdf-btn:hover {
    background: #fee2e2;
    border-color: #fca5a5;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

th, td { padding: 14px; font-size: 14px; }
th { background-color: #f8fafc; text-align: left; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #eee; }
tr:hover { background-color: #fafafa; }

.status-cell { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.orange { background-color: #ff9800; }
.blue { background-color: #2196f3; }
.green { background-color: #4caf50; }
.gray { background-color: #9e9e9e; }

button {
    background: #1976d2;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: 0.2s;
}

button:hover { background: #1565c0; }

.empty-msg {
    background: white;
    padding: 30px;
    border-radius: 14px;
    text-align: center;
    color: #64748b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<header>
    <h1 id="wardTitle">DrugAssist – Osztály</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-weight:600;">🏠</a></div>
        <div id="dateTime" style="color:#64748b; font-size:14px; font-weight:600;"></div>
    </div>
</header>

<div class="container">

    <!-- DÁTUM LAPOZÓ & PDF CARD -->
    <div class="date-picker-card">
        <div class="date-controls">
            <button class="date-btn" onclick="changeDate(-1)">◀ Előző nap</button>
            <input type="date" id="dateInput" class="date-input" onchange="onDateInputChange(this.value)">
            <button class="date-btn" onclick="changeDate(1)">Következő nap ▶</button>
            <button class="date-btn" style="background:#2e7d32; color:white; border:none;" onclick="setToday()">Mai nap</button>
        </div>
        <button class="pdf-btn" onclick="generateDepartmentPdf(currentDept)">
            📄 Osztályos összesítő PDF
        </button>
    </div>

    <div id="tableContainer">
        <table id="wardTable">
            <thead>
                <tr>
                    <th>Beteg</th>
                    <th>Ágy</th>
                    <th>Státusz</th>
                    <th style="text-align: right;">Aktivitás</th>
                </tr>
            </thead>
            <tbody id="wardTableBody">
                <tr>
                    <td colspan="4" style="text-align:center; color:#64748b; padding:24px;">Betegek betöltése...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
let currentDept = 'Belgyógyászat';
let selectedDate = new Date();

document.addEventListener("DOMContentLoaded", async () => {
    const user = Auth.requireAuth();

    // 1. Osztály kiolvasása URL paraméterből vagy a felhasználói kontextusból
    const urlParams = new URLSearchParams(window.location.search);
    currentDept = urlParams.get('department') || (user ? user.activeDepartment : 'Belgyógyászat');

    document.getElementById("wardTitle").innerText = `DrugAssist – ${currentDept}`;

    // Mai nap beállítása és betöltése
    setToday();
});

function setToday() {
    selectedDate = new Date();
    updateDatePickerUI();
    loadWardPatients();
}

function changeDate(days) {
    selectedDate.setDate(selectedDate.getDate() + days);
    updateDatePickerUI();
    loadWardPatients();
}

function onDateInputChange(val) {
    if (!val) return;
    const parts = val.split('-');
    selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
    updateDatePickerUI();
    loadWardPatients();
}

function updateDatePickerUI() {
    const year = selectedDate.getFullYear();
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const day = String(selectedDate.getDate()).padStart(2, '0');
    
    document.getElementById("dateInput").value = `${year}-${month}-${day}`;
}

async function loadWardPatients() {
    const tbody = document.getElementById("wardTableBody");
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b; padding:24px;">Betegek betöltése...</td></tr>';

    try {
        // Kiválasztott nap kezdetének és végének kiszámítása helyi időben
        const startOfDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 0, 0, 0).toISOString();
        const endOfDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 23, 59, 59, 999).toISOString();

        // 1. Aktív betegek lekérése az adott osztályról
        const { data: patients, error: pErr } = await window.supabaseClient
            .from('patients')
            .select('*')
            .eq('department', currentDept)
            .eq('status', 'active')
            .order('room_bed', { ascending: true });

        if (pErr) throw pErr;

        if (!patients || patients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b; padding:30px;">Nincs aktív beteg ezen az osztályon.</td></tr>';
            return;
        }

        const patientIds = patients.map(p => p.id);

        // 2. Igénylések lekérése a betegekhez a kiválasztott napra
        const { data: prescriptions, error: prErr } = await window.supabaseClient
            .from('prescriptions')
            .select('id, patient_id, status, created_at')
            .in('patient_id', patientIds)
            .gte('created_at', startOfDay)
            .lte('created_at', endOfDay)
            .order('created_at', { ascending: false });

        if (prErr) console.error("Prescriptions hiba:", prErr);

        // Legfrissebb igénylés kikeresése betegenként
        const latestPrescriptionMap = {};
        if (prescriptions) {
            prescriptions.forEach(p => {
                if (!latestPrescriptionMap[p.patient_id]) {
                    latestPrescriptionMap[p.patient_id] = p;
                }
            });
        }

        // 3. Táblázat összefűzése
        let html = '';
        patients.forEach(patient => {
            const presc = latestPrescriptionMap[patient.id];
            let statusText = 'Nincs feladva';
            let dotClass = 'gray';
            let targetUrl = `prescription.html?patientId=${patient.id}`;

            if (presc) {
                if (presc.status === 'submitted') {
                    statusText = 'Jóváhagyásra vár';
                    dotClass = 'orange';
                    targetUrl = `approval.html?patientId=${patient.id}&prescriptionId=${presc.id}`;
                } else if (presc.status === 'reviewed') {
                    statusText = 'Gyógyszerelésre vár';
                    dotClass = 'blue';
                    targetUrl = `patient.html?patientId=${patient.id}&prescriptionId=${presc.id}`;
                } else if (presc.status === 'dispensed') {
                    statusText = 'Ellenőrzésre vár';
                    dotClass = 'green';
                    targetUrl = `patient.html?patientId=${patient.id}&prescriptionId=${presc.id}`;
                } else if (presc.status === 'completed') {
                    statusText = 'Készen van';
                    dotClass = 'green';
                    targetUrl = `review.html?patientId=${patient.id}&prescriptionId=${presc.id}`;
                }
            }

            html += `
                <tr>
                    <td><strong>${patient.name}</strong></td>
                    <td>${patient.room_bed || '-'}</td>
                    <td>
                        <div class="status-cell">
                            <div class="status-dot ${dotClass}"></div>
                            <span>${statusText}</span>
                        </div>
                    </td>
                    <td style="text-align: right;">
                        <button onclick="location.href='${targetUrl}'">Megnyitás</button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;

    } catch (err) {
        console.error("Hiba az osztályos adatok betöltésekor:", err);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#c62828; padding:24px;">Hiba történt az adatok betöltése során.</td></tr>';
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
