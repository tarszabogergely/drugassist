<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Osztályos Betegellátás</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    color: #1e293b;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.dept-badge {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #bbdefb;
    background: #e3f2fd;
    color: #1565c0;
    font-weight: 700;
    font-size: 13px;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.logout-btn:hover { background: #ffcdd2; }

.container { padding: 32px; max-width: 1280px; margin: auto; }

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.top-bar h2 { margin: 0; color: #2c3e50; }

.filter-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    align-items: center;
}

.search-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    outline: none;
}

.search-input:focus {
    border-color: #1976d2;
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
}

.select-filter {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
    background: white;
    font-weight: 600;
    color: #334155;
}

.add-patient-btn {
    background: #1976d2;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
}

.add-patient-btn:hover { background: #1565c0; }

/* PATIENT TABLE */
.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td { padding: 14px; text-align: left; font-size: 14px; }
th { background-color: #f8fafc; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
tr:hover { background-color: #f8fafc; }

.bed-badge {
    background: #e2e8f0;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
    color: #334155;
}

.status-badge {
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    display: inline-block;
}

.status-pending { background: #fff3e0; color: #e65100; }
.status-reviewed { background: #e3f2fd; color: #1565c0; }
.status-dispensed { background: #f3e5f5; color: #7b1fa2; }
.status-completed { background: #e8f5e9; color: #2e7d32; }
.status-none { background: #f1f5f9; color: #64748b; }

.action-btn {
    padding: 7px 12px;
    border-radius: 6px;
    border: none;
    background: #1976d2;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
}

.action-btn:hover { background: #1565c0; }

.weekend-btn {
    padding: 7px 12px;
    border-radius: 6px;
    border: none;
    background: #2e7d32;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
    margin-left: 4px;
}

.weekend-btn:hover { background: #1b5e20; }

.reactivate-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #2e7d32;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
}

.reactivate-btn:hover { background: #256428; }

.edit-btn {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 4px;
    font-weight: 600;
}

.edit-btn:hover { background: #e2e8f0; }

.discharge-btn {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 4px;
}

.discharge-btn:hover { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-card {
    background: white;
    width: 460px;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.modal-card h3 { margin-top: 0; color: #1e293b; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
.form-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    box-sizing: border-box;
}

.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.cancel-btn { background: #f1f5f9; color: #475569; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.save-btn { background: #1976d2; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Osztályos Betegek</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-size:18px; font-weight:600;" title="Kezdőlap">🏠</a></div>
        <span id="userName" style="font-weight:600;">Dr. Kezelőorvos</span>
        
        <!-- FIX OSZTÁLY JELZÉS (ZÁROLT) -->
        <span id="deptBadge" class="dept-badge">Osztály: Betöltés...</span>

        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

    <div class="top-bar">
        <div>
            <h2 id="deptTitle">Osztályos Betegek</h2>
            <div id="subTitle" style="color:#64748b; font-size:14px; margin-top:4px;">Aktív ápolt betegek listája</div>
        </div>
        <button class="add-patient-btn" onclick="openPatientModal()">➕ Új beteg rögzítése</button>
    </div>

    <!-- KERESŐ ÉS SZŰRŐ SÁV -->
    <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Beteg neve, TAJ száma vagy ágyszáma keresése..." oninput="filterPatients()">
        <select id="statusFilter" class="select-filter" onchange="loadDepartmentPatients()">
            <option value="active">✓ Aktív ápolt betegek</option>
            <option value="discharged">📦 Elbocsátott / Passzív betegek</option>
        </select>
    </div>

    <!-- BETEG TÁBLÁZAT -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th style="width: 90px;">Ágyszám</th>
                    <th>Beteg Neve</th>
                    <th>TAJ Szám</th>
                    <th>Születési Dátum (Kor)</th>
                    <th>Mai Gyógyszerelés Státusza</th>
                    <th style="text-align: right;">Műveletek</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
                <!-- JavaScript tölti fel -->
            </tbody>
        </table>
    </div>

</div>

<!-- BETEG RÖGZÍTŐ / SZERKESZTŐ MODAL -->
<div id="patientModal" class="modal-overlay">
    <div class="modal-card">
        <h3 id="modalTitle">➕ Beteg adatai</h3>
        <input type="hidden" id="patientId">
        
        <div class="form-group">
            <label>Beteg Neve *</label>
            <input type="text" id="patientNameInput" placeholder="pl. Kovács János">
        </div>

        <div class="form-group">
            <label>TAJ Szám *</label>
            <input type="text" id="patientTajInput" placeholder="123 456 789">
        </div>

        <div class="form-group">
            <label>Születési Dátum *</label>
            <input type="date" id="patientBirthDateInput">
        </div>

        <div class="form-group">
            <label>Kórterem / Ágyszám *</label>
            <input type="text" id="patientBedInput" placeholder="pl. 12/B">
        </div>

        <div class="modal-actions">
            <button class="cancel-btn" onclick="closePatientModal()">Mégse</button>
            <button class="save-btn" onclick="savePatient()">Beteg Mentése</button>
        </div>
    </div>
</div>

<script>
let currentDept = '';
let loadedPatients = [];
let todaysPrescriptionsMap = {}; // Patient ID -> Prescription Object

document.addEventListener("DOMContentLoaded", async () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name || user.email;
        
        // Az orvoshoz rendelt osztály lekérése (vagy profilból, vagy kontextusból)
        currentDept = user.department || user.activeDepartment || 'Belgyógyászat';
        
        document.getElementById("deptBadge").innerText = `Osztály: ${currentDept}`;
        document.getElementById("deptTitle").innerText = `${currentDept} Osztály`;
        
        await loadDepartmentPatients();
    }
});

// Életkor kiszámítása születési dátumból
function calculateAge(birthDateStr) {
    if (!birthDateStr) return null;
    const birthDate = new Date(birthDateStr);
    if (isNaN(birthDate)) return null;
    
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;
}

// 1. Osztályos betegek és mai igénylések betöltése Supabase-ből
async function loadDepartmentPatients() {
    const tbody = document.getElementById("patientTableBody");
    const viewStatus = document.getElementById("statusFilter").value;
    
    document.getElementById("subTitle").innerText = viewStatus === 'active' 
        ? "Aktív ápolt betegek listája" 
        : "Elbocsátott / Passzív betegek listája";

    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">Betegek betöltése...</td></tr>';

    try {
        // 1. LÉPÉS: Betegek lekérése az osztályról
        const { data: patients, error } = await window.supabaseClient
            .from('patients')
            .select('*')
            .eq('department', currentDept)
            .eq('status', viewStatus)
            .order('room_bed', { ascending: true });

        if (error || !patients || patients.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b; padding:30px;">
                Nincs ${viewStatus === 'active' ? 'aktív' : 'elbocsátott'} beteg a(z) "${currentDept}" osztályon.
            </td></tr>`;
            return;
        }

        loadedPatients = patients;
        const patientIds = patients.map(p => String(p.id));

        todaysPrescriptionsMap = {};
        
        // 2. LÉPÉS: Legfrissebb igénylések lekérése
        if (patientIds.length > 0) {
            const { data: prescriptions, error: prescErr } = await window.supabaseClient
                .from('prescriptions')
                .select('*')
                .in('patient_id', patientIds)
                .order('created_at', { ascending: false });

            if (prescErr) {
                console.error("Prescriptions lekérdezési hiba:", prescErr);
            } else if (prescriptions) {
                prescriptions.forEach(p => {
                    const pidStr = String(p.patient_id);
                    if (!todaysPrescriptionsMap[pidStr]) {
                        todaysPrescriptionsMap[pidStr] = p;
                    }
                });
            }
        }

        renderPatientTable(loadedPatients);

    } catch (err) {
        console.error("Hiba a betegek betöltésekor:", err);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#c62828; padding:30px;">Hiba történt az adatok betöltése során.</td></tr>';
    }
}

function renderPatientTable(patients) {
    const tbody = document.getElementById("patientTableBody");
    const viewStatus = document.getElementById("statusFilter").value;

    if (!patients || patients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b; padding:30px;">Nincs a szűrésnek megfelelő beteg.</td></tr>';
        return;
    }

    let html = '';
    patients.forEach((p, idx) => {
        const birthDateFormatted = p.birth_date ? new Date(p.birth_date).toLocaleDateString('hu-HU') : '-';
        const age = calculateAge(p.birth_date);
        const ageStr = age !== null ? ` (${age} év)` : '';

        // Beteg azonosító biztos sztringgé alakítása
        const presc = todaysPrescriptionsMap[String(p.id)];
        let statusBadge = '<span class="status-badge status-none">Nincs feladva</span>';

        if (presc) {
            const st = presc.status;
            if (st === 'pending' || st === 'submitted' || st === 'draft') {
                statusBadge = '<span class="status-badge status-pending">🟠 Jóváhagyásra vár</span>';
            } else if (st === 'reviewed') {
                statusBadge = '<span class="status-badge status-reviewed">🔵 Jóváhagyva</span>';
            } else if (st === 'dispensed') {
                statusBadge = '<span class="status-badge status-dispensed">🟣 Tálcázva (Ellenőrzésre vár)</span>';
            } else if (st === 'completed') {
                statusBadge = '<span class="status-badge status-completed">🟢 Elkészült & Ellenőrizve</span>';
            } else {
                statusBadge = `<span class="status-badge status-pending">🟠 ${st}</span>`;
            }
        }

        html += `
            <tr>
                <td><span class="bed-badge">${p.room_bed || '-'}</span></td>
                <td>
                    <strong style="font-size:15px; color:#1e293b;">
                        ${p.name}
                    </strong>
                </td>
                <td style="color:#64748b; font-family:monospace;">${p.taj || '-'}</td>
                <td style="color:#475569;">${birthDateFormatted}${ageStr}</td>
                <td>${statusBadge}</td>
                <td style="text-align: right;">
    ${viewStatus === 'active' ? `
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
            <div style="display: flex; gap: 4px;">
                <button class="action-btn" onclick="location.href='prescription.html?patientId=${p.id}'">📋 Napi gyógyszerelés</button>
                <button class="weekend-btn" onclick="location.href='multi-day-prescription.html?patientId=${p.id}'">📅 Többnapos gyógyszerelés</button>
            </div>
            <div style="display: flex; gap: 4px;">
                <button class="edit-btn" style="margin-left:0;" onclick="openPatientModal(${idx})">✏️ Szerkesztés</button>
                <button class="discharge-btn" style="margin-left:0;" onclick="dischargePatient('${p.id}', '${p.name}')">Hazament</button>
            </div>
        </div>
    ` : `
        <button class="reactivate-btn" onclick="reactivatePatient('${p.id}', '${p.name}')">♻️ Újragyógyszerezés / Reaktiválás</button>
    `}
</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

function filterPatients() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!query) {
        renderPatientTable(loadedPatients);
        return;
    }

    const filtered = loadedPatients.filter(p => 
        (p.name && p.name.toLowerCase().includes(query)) ||
        (p.taj && p.taj.toLowerCase().includes(query)) ||
        (p.room_bed && p.room_bed.toLowerCase().includes(query))
    );

    renderPatientTable(filtered);
}

// 2. Modal megnyitása (Új vagy Szerkesztés)
function openPatientModal(index = null) {
    if (index !== null && loadedPatients[index]) {
        const p = loadedPatients[index];
        document.getElementById("modalTitle").innerText = "✏️ Beteg adatainak szerkesztése";
        document.getElementById("patientId").value = p.id;
        document.getElementById("patientNameInput").value = p.name || '';
        document.getElementById("patientTajInput").value = p.taj || '';
        document.getElementById("patientBirthDateInput").value = p.birth_date || '';
        document.getElementById("patientBedInput").value = p.room_bed || '';
    } else {
        document.getElementById("modalTitle").innerText = "➕ Új beteg rögzítése az osztályra";
        document.getElementById("patientId").value = '';
        document.getElementById("patientNameInput").value = '';
        document.getElementById("patientTajInput").value = '';
        document.getElementById("patientBirthDateInput").value = '';
        document.getElementById("patientBedInput").value = '';
    }

    document.getElementById("patientModal").style.display = "flex";
}

function closePatientModal() {
    document.getElementById("patientModal").style.display = "none";
}

// 3. Mentés (Új beszúrás vagy meglévő frissítése)
async function savePatient() {
    const patientId = document.getElementById("patientId").value;
    const name = document.getElementById("patientNameInput").value.trim();
    const taj = document.getElementById("patientTajInput").value.trim();
    const birthDate = document.getElementById("patientBirthDateInput").value;
    const bed = document.getElementById("patientBedInput").value.trim();

    if (!name || !taj || !bed) {
        alert("Kérjük, töltse ki a Név, TAJ szám és Ágyszám mezőket!");
        return;
    }

    try {
        if (patientId) {
            const { error } = await window.supabaseClient
                .from('patients')
                .update({
                    name: name,
                    taj: taj,
                    birth_date: birthDate || null,
                    room_bed: bed,
                    department: currentDept
                })
                .eq('id', patientId);

            if (error) throw error;
        } else {
            const { error } = await window.supabaseClient
                .from('patients')
                .insert({
                    name: name,
                    taj: taj,
                    birth_date: birthDate || null,
                    room_bed: bed,
                    department: currentDept,
                    status: 'active'
                });

            if (error) throw error;
        }

        closePatientModal();
        loadDepartmentPatients();

    } catch (err) {
        console.error("Hiba a beteg mentésekor:", err);
        alert("Hiba történt a beteg mentése során!");
    }
}

// 4. Beteg elbocsátása / Hazament (Soft-delete)
async function dischargePatient(patientId, name) {
    if (!confirm(`Biztosan elbocsátja ${name} nevű beteget? A beteg lekerül az aktív osztályos listáról.`)) {
        return;
    }

    try {
        await window.supabaseClient
            .from('patients')
            .update({ status: 'discharged', discharge_date: new Date() })
            .eq('id', patientId);

        loadDepartmentPatients();

    } catch (err) {
        console.error("Hiba az elbocsátás során:", err);
    }
}

// 5. Beteg reaktiválása (Újragyógyszerezés)
async function reactivatePatient(patientId, name) {
    const newBed = prompt(`Adja meg ${name} új kórterem/ágyszámát az osztályra való visszavételhez:`, "12/A");
    if (!newBed) return;

    try {
        const { error } = await window.supabaseClient
            .from('patients')
            .update({ 
                status: 'active', 
                room_bed: newBed.trim(),
                discharge_date: null 
            })
            .eq('id', patientId);

        if (error) throw error;

        alert(`${name} sikeresen reaktiválva az aktív ápolt betegek közé!`);
        document.getElementById("statusFilter").value = 'active';
        loadDepartmentPatients();

    } catch (err) {
        console.error("Hiba a reaktiválás során:", err);
        alert("Hiba történt a beteg reaktiválása során!");
    }
}
</script>

</body>
</html>
