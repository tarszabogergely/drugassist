<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Osztályos Betegellátás</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 { margin: 0; font-size: 22px; color: #1565c0; }

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.badge-select {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #c8e6c9;
    background: #f0f7ed;
    color: #2e7d32;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.container { padding: 32px; max-width: 1200px; margin: auto; }

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.top-bar h2 { margin: 0; color: #2c3e50; }

.add-patient-btn {
    background: #1976d2;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
}

.add-patient-btn:hover { background: #1565c0; }

/* PATIENT TABLE */
.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td { padding: 14px; text-align: left; font-size: 14px; }
th { background-color: #f8fafc; color: #475569; font-weight: 600; }
tr:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
tr:hover { background-color: #f8fafc; }

.bed-badge {
    background: #e2e8f0;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
    color: #334155;
}

.status-badge {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
}

.status-submitted { background: #fff3e0; color: #e65100; }
.status-completed { background: #e8f5e9; color: #2e7d32; }
.status-none { background: #f1f5f9; color: #64748b; }

.action-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #1976d2;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
}

.action-btn:hover { background: #1565c0; }

.edit-btn {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 6px;
    font-weight: 600;
}

.edit-btn:hover { background: #e2e8f0; }

.discharge-btn {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 6px;
}

.discharge-btn:hover { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-card {
    background: white;
    width: 460px;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.modal-card h3 { margin-top: 0; color: #1e293b; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
.form-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    box-sizing: border-box;
}

.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.cancel-btn { background: #f1f5f9; color: #475569; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.save-btn { background: #1976d2; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Osztályos Betegek</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-weight:600; margin-right:10px;">← Vissza a kezdőlapra</a></div>
        <span id="userName" style="font-weight:600;">Dr. Kovács Anna</span>
        
        <!-- OSZTÁLY VÁLASZTÓ -->
        <select id="deptSelector" class="badge-select" onchange="changeDepartment(this.value)">
            <option value="Belgyógyászat">Belgyógyászat</option>
            <option value="Sebészet">Sebészet</option>
            <option value="Neurológia">Neurológia</option>
            <option value="Kardiológia">Kardiológia</option>
        </select>

        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

    <div class="top-bar">
        <div>
            <h2 id="deptTitle">Belgyógyászati Osztály</h2>
            <div style="color:#64748b; font-size:14px; margin-top:4px;">Aktív ápolt betegek listája</div>
        </div>
        <button class="add-patient-btn" onclick="openPatientModal()">➕ Új beteg rögzítése</button>
    </div>

    <!-- BETEG TÁBLÁZAT -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th style="width: 90px;">Ágyszám</th>
                    <th>Beteg Neve</th>
                    <th>TAJ Szám</th>
                    <th>Születési Dátum (Kor)</th>
                    <th>Mai Gyógyszerelés</th>
                    <th style="text-align: right;">Műveletek</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
                <!-- JavaScript tölti fel -->
            </tbody>
        </table>
    </div>

</div>

<!-- BETEG RÖGZÍTŐ / SZERKESZTŐ MODAL -->
<div id="patientModal" class="modal-overlay">
    <div class="modal-card">
        <h3 id="modalTitle">➕ Beteg adatai</h3>
        <input type="hidden" id="patientId">
        
        <div class="form-group">
            <label>Beteg Neve *</label>
            <input type="text" id="patientNameInput" placeholder="pl. Kovács János">
        </div>

        <div class="form-group">
            <label>TAJ Szám *</label>
            <input type="text" id="patientTajInput" placeholder="123 456 789">
        </div>

        <div class="form-group">
            <label>Születési Dátum *</label>
            <input type="date" id="patientBirthDateInput">
        </div>

        <div class="form-group">
            <label>Kórterem / Ágyszám *</label>
            <input type="text" id="patientBedInput" placeholder="pl. 12/B">
        </div>

        <div class="modal-actions">
            <button class="cancel-btn" onclick="closePatientModal()">Mégse</button>
            <button class="save-btn" onclick="savePatient()">Beteg Mentése</button>
        </div>
    </div>
</div>

<script>
let currentDept = 'Belgyógyászat';
let loadedPatients = [];

document.addEventListener("DOMContentLoaded", () => {
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name;
        currentDept = user.activeDepartment || 'Belgyógyászat';
        document.getElementById("deptSelector").value = currentDept;
        document.getElementById("deptTitle").innerText = `${currentDept} Osztály`;
        
        loadDepartmentPatients();
    }
});

function changeDepartment(newDept) {
    currentDept = newDept;
    Auth.updateContext(null, newDept);
    document.getElementById("deptTitle").innerText = `${currentDept} Osztály`;
    loadDepartmentPatients();
}

// Életkor kiszámítása születési dátumból
function calculateAge(birthDateStr) {
    if (!birthDateStr) return null;
    const birthDate = new Date(birthDateStr);
    if (isNaN(birthDate)) return null;
    
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;
}

// 1. Osztályos betegek betöltése Supabase-ből
async function loadDepartmentPatients() {
    const tbody = document.getElementById("patientTableBody");
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">Betegek betöltése...</td></tr>';

    try {
        const { data: patients, error } = await window.supabaseClient
            .from('patients')
            .select('*')
            .eq('department', currentDept)
            .eq('status', 'active')
            .order('room_bed', { ascending: true });

        if (error || !patients || patients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b; padding:30px;">Nincs aktív beteg ezen az osztályon. Használja az "Új beteg rögzítése" gombot!</td></tr>';
            return;
        }

        loadedPatients = patients;

        let html = '';
        patients.forEach((p, idx) => {
            const birthDateFormatted = p.birth_date ? new Date(p.birth_date).toLocaleDateString('hu-HU') : '-';
            const age = calculateAge(p.birth_date);
            const ageStr = age !== null ? ` (${age} év)` : '';

            html += `
                <tr>
                    <td><span class="bed-badge">${p.room_bed || '-'}</span></td>
                    <td>
                        <strong style="font-size:15px; color:#1e293b; cursor:pointer;" onclick="openPatientModal(${idx})">
                            ${p.name}
                        </strong>
                    </td>
                    <td style="color:#64748b; font-family:monospace;">${p.taj || '-'}</td>
                    <td style="color:#475569;">${birthDateFormatted}${ageStr}</td>
                    <td><span class="status-badge status-none">Nincs feladva</span></td>
                    <td style="text-align: right;">
                        <button class="action-btn" onclick="location.href='prescription.html?patientId=${p.id}'">📋 Gyógyszerelés</button>
                        <button class="edit-btn" onclick="openPatientModal(${idx})">✏️ Szerkesztés</button>
                        <button class="discharge-btn" onclick="dischargePatient('${p.id}', '${p.name}')">Hazament</button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;

    } catch (err) {
        console.error("Hiba a betegek betöltésekor:", err);
    }
}

// 2. Modal megnyitása (Új vagy Szerkesztés)
function openPatientModal(index = null) {
    if (index !== null && loadedPatients[index]) {
        // SZERKESZTÉS MÓD
        const p = loadedPatients[index];
        document.getElementById("modalTitle").innerText = "✏️ Beteg adatainak szerkesztése";
        document.getElementById("patientId").value = p.id;
        document.getElementById("patientNameInput").value = p.name || '';
        document.getElementById("patientTajInput").value = p.taj || '';
        document.getElementById("patientBirthDateInput").value = p.birth_date || '';
        document.getElementById("patientBedInput").value = p.room_bed || '';
    } else {
        // ÚJ BETEG MÓD
        document.getElementById("modalTitle").innerText = "➕ Új beteg rögzítése az osztályra";
        document.getElementById("patientId").value = '';
        document.getElementById("patientNameInput").value = '';
        document.getElementById("patientTajInput").value = '';
        document.getElementById("patientBirthDateInput").value = '';
        document.getElementById("patientBedInput").value = '';
    }

    document.getElementById("patientModal").style.display = "flex";
}

function closePatientModal() {
    document.getElementById("patientModal").style.display = "none";
}

// 3. Mentés (Új beszúrás vagy meglévő frissítése)
async function savePatient() {
    const patientId = document.getElementById("patientId").value;
    const name = document.getElementById("patientNameInput").value.trim();
    const taj = document.getElementById("patientTajInput").value.trim();
    const birthDate = document.getElementById("patientBirthDateInput").value;
    const bed = document.getElementById("patientBedInput").value.trim();

    if (!name || !taj || !bed) {
        alert("Kérjük, töltse ki a Név, TAJ szám és Ágyszám mezőket!");
        return;
    }

    try {
        if (patientId) {
            // MEGLÉVŐ BETEG FRISSÍTÉSE
            const { error } = await window.supabaseClient
                .from('patients')
                .update({
                    name: name,
                    taj: taj,
                    birth_date: birthDate || null,
                    room_bed: bed,
                    department: currentDept
                })
                .eq('id', patientId);

            if (error) throw error;
        } else {
            // ÚJ BETEG HOZZÁADÁSA
            const { error } = await window.supabaseClient
                .from('patients')
                .insert({
                    name: name,
                    taj: taj,
                    birth_date: birthDate || null,
                    room_bed: bed,
                    department: currentDept,
                    status: 'active'
                });

            if (error) throw error;
        }

        closePatientModal();
        loadDepartmentPatients();

    } catch (err) {
        console.error("Hiba a beteg mentésekor:", err);
        alert("Hiba történt a beteg mentése során!");
    }
}

// 4. Beteg elbocsátása / Hazament (Soft-delete)
async function dischargePatient(patientId, name) {
    if (!confirm(`Biztosan elbocsátja ${name} nevű beteget? A beteg lekerül az aktív osztályos listáról.`)) {
        return;
    }

    try {
        await window.supabaseClient
            .from('patients')
            .update({ status: 'discharged', discharge_date: new Date() })
            .eq('id', patientId);

        loadDepartmentPatients();

    } catch (err) {
        console.error("Hiba az elbocsátás során:", err);
    }
}
</script>

</body>
</html>
