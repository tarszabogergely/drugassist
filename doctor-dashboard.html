<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>DrugAssist – Orvosi Munkaterület</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK, Config & Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f9;
}

header {
    background: white;
    padding: 14px 32px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    color: #1e293b;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 14px;
    color: #475569;
    font-weight: 600;
}

.logout-btn {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.logout-btn:hover { background: #ffcdd2; }

.container {
    padding: 32px;
    max-width: 1200px;
    margin: auto;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 20px;
}

/* BETEG KÁRTYÁK */
.patients-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
}

.patient-card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.2s;
}

.patient-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.patient-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
}

.patient-name {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
}

.bed-badge {
    background: #e2e8f0;
    color: #334155;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
}

.patient-info-list {
    font-size: 13px;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 18px;
}

.status-line {
    margin-top: 6px;
    font-weight: 600;
    font-size: 13px;
}

.status-submitted { color: #e65100; }
.status-reviewed { color: #1565c0; }
.status-completed { color: #2e7d32; }
.status-none { color: #94a3b8; }

.card-actions {
    display: flex;
    gap: 8px;
    border-top: 1px solid #f1f5f9;
    padding-top: 14px;
}

.btn-primary {
    flex: 1;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.btn-primary:hover { background: #1565c0; }

.btn-weekend {
    flex: 1;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.btn-weekend:hover { background: #1b5e20; }

.empty-msg {
    background: white;
    padding: 30px;
    border-radius: 14px;
    text-align: center;
    color: #64748b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<header>
    <h1>DrugAssist – Orvosi Igénylő Felület</h1>
    <div class="header-right">
        <div><a href="dashboard.html" style="text-decoration:none; color:#1976d2; font-size:18px; font-weight:600;" title="Kezdőlap">🏠</a></div>
        <div><span id="userName">Betöltés...</span> | <span id="dateTime"></span></div>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>
</header>

<div class="container">

<div class="section-title">🏥 Osztályos Betegek & Mai Gyógyszerigénylés</div>

<div id="patientsContainer" class="patients-grid">
    <div class="empty-msg">Betegek betöltése...</div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // 1. AUTENTIKÁCIÓ ÉS FELHASZNÁLÓ KIJELZÉSE
    const user = Auth.requireAuth();
    if (user) {
        document.getElementById("userName").innerText = user.name || user.email;

        try {
            const { data: profile } = await window.supabaseClient
                .from('profiles')
                .select('full_name, department')
                .or(`id.eq.${user.id},user_id.eq.${user.id}`)
                .maybeSingle();

            if (profile && profile.full_name) {
                document.getElementById("userName").innerText = profile.full_name;
            }
        } catch (e) {
            console.error("Profil betöltési hiba:", e);
        }
    }

    loadDoctorPatients();
});

async function loadDoctorPatients() {
    const container = document.getElementById("patientsContainer");

    try {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString();

        // 1. AKTÍV BETEGEK LEKÉRDEZÉSE
        const { data: patients, error: patErr } = await window.supabaseClient
            .from('patients')
            .select('*')
            .eq('status', 'active')
            .order('room_bed', { ascending: true });

        if (patErr) throw patErr;

        if (!patients || patients.length === 0) {
            container.innerHTML = '<div class="empty-msg">Jelenleg nincs aktív beteg rögzítve az osztályon.</div>';
            return;
        }

        // 2. MAI PRESCRIPTION-ÖK LEKÉRDEZÉSE
        const { data: todayPrescriptions } = await window.supabaseClient
            .from('prescriptions')
            .select('id, status, patient_id')
            .gte('created_at', startOfToday);

        const patientPrescMap = {};
        if (todayPrescriptions) {
            todayPrescriptions.forEach(p => {
                patientPrescMap[p.patient_id] = p;
            });
        }

        // 3. HTML KÁRTYÁK GENERÁLÁSA
        let html = '';
        patients.forEach(patient => {
            const presc = patientPrescMap[patient.id];
            const statusObj = getDoctorStatusDisplay(presc ? presc.status : null);

            html += `
                <div class="patient-card">
                    <div>
                        <div class="patient-header">
                            <div class="patient-name">${patient.name}</div>
                            <div class="bed-badge">${patient.room_bed || 'Ágy: -'}</div>
                        </div>
                        <div class="patient-info-list">
                            <div><strong>TAJ:</strong> ${patient.taj || '-'}</div>
                            <div><strong>Osztály:</strong> ${patient.department || '-'}</div>
                            <div class="status-line ${statusObj.className}">
                                <strong>Mai állapot:</strong> ${statusObj.label}
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-primary" onclick="location.href='prescription.html?patientId=${patient.id}'">
                            + Napi igénylés
                        </button>
                        <button class="btn-weekend" onclick="location.href='multi-day-prescription.html?patientId=${patient.id}'">
                            📅 Hétvégi / Többnapos
                        </button>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

    } catch (err) {
        console.error("Hiba a betegek betöltésekor:", err);
        container.innerHTML = '<div class="empty-msg">Hiba történt az adatok betöltése során.</div>';
    }
}

function getDoctorStatusDisplay(status) {
    switch (status) {
        case 'submitted':
            return { label: '⏳ Jóváhagyásra vár', className: 'status-submitted' };
        case 'reviewed':
            return { label: '✓ Jóváhagyva', className: 'status-reviewed' };
        case 'dispensed':
            return { label: '🔍 Ellenőrzésre vár', className: 'status-reviewed' };
        case 'completed':
            return { label: '✓ Kész / Átadva', className: 'status-completed' };
        default:
            return { label: '⚪ Még nincs mai igénylés', className: 'status-none' };
    }
}

function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").innerText = now.toLocaleDateString("hu-HU") + " | " + now.toLocaleTimeString("hu-HU", {hour: '2-digit', minute: '2-digit'});
}
updateDateTime();
setInterval(updateDateTime, 10000);
</script>

</body>
</html>
